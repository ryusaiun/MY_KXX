 FLS.1.t:0 "福克兰群岛状况"
 FLS.1.d:0 "福克兰群岛或马尔维纳斯群岛一直被外国占领，主要来自欧洲，如西班牙、法国和英国。1833年，英国恢复了对阿根廷人统治下的该岛的统治，这导致两国关系恶化。\n\n在世界大战期间，该岛曾被用作协约国护航船队和船只的船坞，但在英国革命后，该岛很快被抢回给阿根廷人。加拿大人曾多次试图夺回该岛，但都以失败告终，甚至连军事行动也是如此。1921年11月阿根廷南部革命后，中央政府对该岛的控制也有所松动,岛上的英国侨民有了喘息的机会。1925年，理查德·伯德一行人在探索南极途中遭遇风暴，在此地停留，被误认为是英国间谍，双方发生了武装冲突，最终以伯德团队脱险结束。在完成探索后，理查德·伯德被美国授予海军少将军衔，并被加拿大政府所雇佣。出于探险的需要，理查德·伯德希望协约国与阿根廷尽快达成协议，但渥太华似乎和他的理解相左。在阿根廷内战再度爆发后，英国皇家海军展开了对该岛的全面入侵，并强迫伯德参与其中，这是伯德做梦也没有想到的。入侵行动残酷无情，伤亡数以百计，但最终还是攻占了岛屿。伯德被任命为政府的 "总司令"，而那些加拿大人拍拍屁股就走人，只要求他守在这一前线。困惑的伯德在不明不白之中成为了这片天地的主人，喜悦和愧疚的心情交杂着，天知道他将来会有什么打算......"
 FLS.1.a:0 "希望不是什么大问题。"
 FLS.2.t:0 "我们的伟大海军少将之旅"
 FLS.2.d:0 "他梦想成真，完全独立自由地探索南极的广袤土地。当他在南方冰冷的海水中航行时，终于偶然发现了南极洲寒冷冰冻的海岸。他踏上海岸，开始探索。没有什么发现，至少发现了几只举着红旗的企鹅。这还不是最令人困惑的部分......当旅程即将结束时，他迅速跳上他的小飞机，告诉他的同事们他将在一两个小时后回来。时间一分一秒地过去，从海军少将口中说出的话却......令人不安。他告诉他的同事们，他发现了一个巨大的洞口，用他的话说，是通往地心的一个未知的、尚未被发现的 "天堂"，在那里，所有 "雅利安人和有价值的人 "都可以无忧无虑地生活。要想再次打开这个洞，靠近南极的所有土地都必须受到伯德少将的圣洁影响，而他就是在那些生活在地心的雅利安定居者的帮助下接受了 "洗礼"。"
 FLS.2.a:0 "他是不是吸了什么......东西？"
 FLS.3.t:0 "协约国提出和平"
 FLS.3.d:0 "随着战争陷入僵局，双方都出现了大量减员，我们和他们决定以和平作为交换条件，换取我们想要占领的国家。"
 FLS.3.a:0 "这是一场胜利！"
 FLS.4.t:0 "帝国公约提出和平"
 FLS.4.d:0 "随着战争陷入僵局，双方都出现了大量减员，我们和他们决定以和平作为交换条件，换取我们想要占领的国家。"
 FLS.4.a:0 "这是一场胜利！"
 FLS.5.t:0 "卷入阿根廷内战"
 FLS.5.d:0 "我们占领火地岛的行为引起了阿根廷人的恼火，两波势力都选择对我们开战了。"
 FLS.5.a:0 "来战吧……"
 FLS.6.t:0 "协约国提出和平"
 FLS.6.d:0 "随着战争陷入僵局，双方都出现了大量减员，我们和他们决定以和平作为交换条件，换取我们想要占领的国家。"
 FLS.6.a:0 "这是一场胜利！"
 FLS.7.t:0 "在布宜诺斯艾利斯自立"
 FLS.7.d:0 "我们已经占领了阿根廷的首都，并得到了一些人的支持，是时候挣脱渥太华的操控了。"
 FLS.7.a:0 "从现在开始，切断和英国人的联络。"
 FLS.7.b:0 "我还是喜欢专心探索南极，这些还是交给那些有良心的英国人来处理。"
 FLS.1929.t:0 "英国皇家海军发动入侵行动"
 FLS.1929.d:0 "随着我们和叛乱分子展开战争，对马尔维纳斯群岛虎视眈眈的英国人再次发动了入侵行动，我们此刻调动军队将非常麻烦……"
 FLS.1929.a:0 "我们必须保住那里！"
 FLS.1929.b:0 "操！这些该死的盎格鲁佬！"

