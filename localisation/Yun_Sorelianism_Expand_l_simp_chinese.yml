 COF_BCD.1.t:0 "布卡德政权要求我们附庸"
 COF_BCD.1.d:0 "随着二次大战的终结，法兰西革命工团领袖马塞尔·布卡德的野心日益膨胀，大搞“大法兰西民族主义”。今日上午，巴黎正式向我们递交了要求归顺的国书，并在两国边境集结兵力。布卡德要求我国成为他的忠实合作者，放弃部分主权。面对此等紧急的事态，我们[FROM.GetNameDef]政府班子的反应是……"
 COF_BCD.1.a:0 "我们别无选择。"
 COF_BCD.1.b:0 "那又怎样？我们不怕法国佬！"
 COF_BCD.2.t:0 "[FROM.GetNameDefCap]选择屈服"
 COF_BCD.2.d:0 "[FROM.GetNameDef]同意归顺我们，他们的命运将由我们法兰西工人决定。"
 COF_BCD.2.a:0 "很好。"
 COF_BCD.3.t:0 "[FROM.GetNameDefCap]拒绝屈服"
 COF_BCD.3.d:0 "[FROM.GetNameDef]拒绝归顺我们，这些狗日的反动派们会后悔这么做的。"
 COF_BCD.3.a:0 "革命法兰西军团前进，冲刺，冲！"
