 FRA_nation_city_collective_decision_desc: "城市，人类文明的集中体现。对于柯布西耶来说，城市也是展现纯粹主义思想最好的地方。我们将按照主席的愿景，彻底改造法国，甚至是世界其他地方的城市。"
 city_of_light: "光辉城市"
 Paris_Plan_Voisin: "瓦赞计划改造"
 Paris_Plan_Voisin_desc: "瓦赞计划（PlanVoisin）由勒·柯布西耶在1925年提出，要求拆除巴黎历史城区，代之以现代主义摩天大楼和高速公路。"
 FRA_purism_headquarters: "纯粹国际总部"
 FRA_purism_headquarters_desc: "亚眠，北部工商业基地，工团主义革命宪章的起源之地，和巴黎一样有着革命的纪念意义。我们已将纯粹国际总部安置于此，从这里向全球各国发出“建构”的新讯息。"
