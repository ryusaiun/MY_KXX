 FRA_Plan_Voisin_decision: "瓦赞计划"
 FRA_Plan_Voisin_decision_desc: "\n£GFX_decision_FRA_Plan_Voisin\n\n\n\n\n柯布西耶同志1925年的“瓦赞计划”（PlanVoisin）提议拆除巴黎历史城区，代之以现代主义摩天大楼和高速公路。这一计划毫无疑问遭到了短视的反对派的阻止。如今我们的第一件事就是执行这个计划，让巴黎成为人类历史上最伟大的城市！"
 FRA_Claude_et_Duval_decision: "圣迪耶和拉罗谢尔-帕利斯计划"
 FRA_Claude_et_Duval_decision_desc: "\n£GFX_decision_FRA_Claude_et_Duval\n\n\n\n\n城市化没有工业化怎么行呢？柯布西耶同志亲自设计了圣迪耶的ClaudeetDuval工厂，这个小地方将会成为新型工业化的标杆！拉罗谢尔-帕利斯（LaRochelle-LaPallice）等地也是如此，这些小城市的工业化水平提高有利于纯粹主义惠及全法兰西，形成工业和城市等级秩序的网络。"
 FRA_Unite_d_Habitation_decision: "马赛公寓计划"
 FRA_Unite_d_Habitation_decision_desc: "\n£GFX_decision_FRA_Unite_d_Habitation\n\n\n\n\n在革命后很长一段时间，法兰西的住房问题一直得不到解决，这令我们的设计师柯布西耶同志深感痛心。柯布西耶已经设计好了集体住宅的蓝图，它将在马赛首先实施！马赛的Citéradieuse包含337户复式公寓及幼儿园、商店、泳池等公共设施，体现“垂直花园城市”理念。其他的“辐射城市”单元也将陆续展开建设，雷泽（Rezé）、布里伊（Briey）、菲尔米尼（Firminy）等地的集体住宅项目，均会得到国家资金支持，作为住房危机的解决方案。"
 FRA_Chandigarh_decision: "昌迪加尔计划"
 FRA_Chandigarh_decision_desc: "\n£GFX_decision_FRA_Chandigarh\n\n\n\n\n作为纯粹国际在全球散叶开花的援助项目，昌迪加尔城市改造计划由柯布西耶同志亲手打造。昌迪加尔是印度旁遮普邦的新首府，由婆罗多公社政府委托勒·柯布西耶进行总体规划，体现国家意志与现代化愿景。其核心组成部分是高等法院、秘书处大楼、议会大厦等行政建筑群。印度和法兰西的友谊将耸立在喜马拉雅山脉之下的高原，其光芒将会超越喜马拉雅！"
 FRA_Zhongshan_Shi_decision: "中山模范市计划"
 FRA_Zhongshan_Shi_decision_desc: "该决议暂不可用。"
 FRA_Ville_Radieuse_decision: "“光辉城市”计划"
 FRA_Ville_Radieuse_decision_desc: "\n£GFX_decision_FRA_Ville_Radieuse\n\n\n\n\n“城市规划的材料是太阳、空间、树木、钢材和钢筋水泥，按照这个顺序和层次结构。”柯布西耶重视自然和人文的融合，他并不是一个生产主义者，而是一个环保主义者！通过国家力量实现功能分区、工业化建造和人口集中管理，一个纯粹主义的技术官僚乌托邦将会被建立起来。光辉城市，将成为整个国家的愿景。"
 FRA_Headquarters_decision: "纯粹国际总部"
 FRA_Headquarters_decision_desc: "\n£GFX_decision_FRA_Headquarters\n\n\n\n\n纯粹主义应当统辖全球！作为国际主义的象征，法兰西应该处于国际秩序的最高点。柯布西耶已经在摹画新的蓝图——亚眠的新人类联盟总部，同时它也是纯粹国际的总部。它集中反映我们法兰西国家集体通过国际组织推动全球治理的愿景。并且，这一次柯布西耶将会容许其他设计师提出建议，通过集思广益达到绝对的完美，其设计理念将决定国际建筑的标准！"
