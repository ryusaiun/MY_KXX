 FRA_rise_of_purism: "纯粹主义的崛起"
 FRA_rise_of_purism_desc: "技官理事会的最终结果已经公布——“最高设计师”柯布西耶将执掌法兰西的权力。纯粹主义将不仅仅是一种美学，它将会发展成为新法兰西社会生活领域总的指导思想。"
 FRA_pure_order: "纯粹秩序"
 FRA_pure_order_desc: "纯粹主义最初追求的就是恢复秩序，反对复杂抽象的立体主义美学。对于全法国来说，拨乱反正的时刻已经到来，秩序是唯一的真理性存在！"
 FRA_pure_race: "纯粹种族"
 FRA_pure_race_desc: "秩序，严谨，简单，自然......这些名词让我们在种族方面自然也要追求纯粹。让我们和柯布西耶的民族主义朋友一起重塑法兰西！"
 FRA_pure_race2: "纯粹种族"
 FRA_pure_race2_desc: "秩序，严谨，简单，自然......这些名词让我们在种族方面自然也要追求纯粹。"
 FRA_technocratic_urbanism: "技官指导下的城市主义"
 FRA_technocratic_urbanism_desc: "我们的最高设计师有很多技术官僚思想的同路人，通过让他们高效地执行柯布西耶同志的城市主义思想，我们可以创造出人类城市的新模范！"
 FRA_erdicate_anti_france: "根除反法分子"
 FRA_erdicate_anti_france_desc: "法兰西！多么伟大，多么光荣！如今的她已经洗清了外在的污浊，但是内部还有许多反法分子还在蛰伏，我们必须以铁腕手段消灭他们！尤其是犹太人！他们是不可接触者！\n金钱、犹太人（部分责任）、共济会，一切都将服从公正的律法！"
 FRA_eugenic_ideas: "实行优生学"
 FRA_eugenic_ideas_desc: "为了使法兰西可以持续发展，维持其世界地位和人类先锋——最好是唯一一种人类的角色。柯布西耶同志已经决定实行优生学，让下一代赢在起跑线上！"
 FRA_nation_city_collective: "国家城市集体"
 FRA_nation_city_collective_desc: "城市，人类文明的集中体现。对于柯布西耶来说，城市也是展现纯粹主义思想最好的地方。柯布西耶下令彻底改造法国的城市，按照纯粹主义的愿景来改造一切！"
 FRA_new_human: "新人类理想"
 FRA_new_human_desc: "新人、新时代、新法兰西。这是柯布西耶的战略构想。其出发点就是新人类的理想，柯布西耶将会从各个角度阐述和塑造新人类的理想，并通过强力的国家机器实施它们。"
 FRA_perfect_system: "无瑕体制"
 FRA_perfect_system_desc: "纯粹主义在理念上是完美无瑕的，在实践中也应当如此！柯布西耶将为我们创造一个无瑕的体制，我们每个人都应该成为这个史无前例体制中不可撼动的一部分！"
 FRA_geometry_hyigene_purity: "几何，卫生，纯洁"
 FRA_geometry_hyigene_purity_desc: "几何，是形式与功能的理性基础；卫生，是现代化生活的物质保障；纯洁，是道德与精神的终极目标。柯布西耶向世人宣布：“纯粹主义是一场主张回归秩序的艺术运动……绘画必须是纯粹的，既是道德的，也是简单的，需要一种基本几何形式的标准化语言。”曾经不被人理解的萨伏伊别墅（Villa_Savoye）如今成为现代建筑师们争先恐后模仿的对象；肮脏破旧的旧城市被标准化的住宅取代；腐朽落后的堕落思想从人民群众的脑中被清除。纯洁的白色成为现代性的标志，象征对旧世界‘污浊’的彻底决裂！经过柯布西耶同志有条不紊的改造，几何，卫生和纯洁三原则已经深入人心。在这样完美的社会中，法兰西人的精神得到了升华，卡特里派的精神后裔让我们重新获得了品味和希望！"
 FRA_order_strong_ration: "有序，阳刚，理性"
 FRA_order_strong_ration_desc: "我们已经超越了法兰西乃至全人类历史的顶点，一个有序，阳刚，理性的崭新世界已经到来！"
 COF_supreme_designer:0 "最高设计师"
 COF_tech.1.t:0 "最高设计师"
 COF_tech.1.d:0 "二十多年前，我们的最高设计师柯布西耶回到了法兰西的心脏巴黎，奥古斯特·佩雷（Auguste_Perret）促成了他和奥森方特的会晤。这历史性的一刻标志着纯粹主义作为一种美学被两人共同创立。欧战之后，他们一起写下了纯粹主义的艺术宣言《立体主义之后》。这是一种植根于新柏拉图主义哲学的美学理论，但其野心并不止步于美学领域。如今，最高设计师终于有机会大展拳脚了，纯粹主义下的法国将会让其思想扩展到所有“表达”之上。全球文明的纯粹完美时刻已经到来！"
 COF_tech.1.a:0 "为改革的最高设计师柯布西耶欢呼！"
 COF_tech.2.t:0 "秩序与幸福"
 COF_tech.2.d:0 "“秩序诞生的地方，幸福就诞生了。”柯布西耶总设计师如是说。而秩序的表现形式是这样的：形式的简单性、组织性、严谨性。人类的自然已经被之前的错误破坏地太严重了，人类必须融入”自然“的秩序，达到永恒的幸福。分类、等级和尊严是至高无上的价值观。法兰西必须被清洗...…干净利落地清洗！"
 COF_tech.2.a:0 "新的精神，新的秩序，新的幸福！"
 COF_tech.3.t:0 "纯血？"
 COF_tech.3.d:0 "早在1926年，柯布西耶就和瓦卢瓦思想的信仰者接触过。那些极右翼的反对派称呼最高设计师为”布尔什维克“，这何其荒谬！事实上，柯布西耶是法兰西最早的一批革命法西斯主义者。不过，我们法兰西人可不像亚平宁半岛上的墨索里尼主义者一样庸俗，他们只是低劣的模仿罗马的冗余罢了，而我们要创造的是纯血的法兰西！在右翼活动家皮埃尔·温特博士、《计划》杂志主编律师菲利普·拉穆尔和工程师弗朗索瓦·德·皮埃尔费乌的陪同下，巴黎曾沐浴在”清洁的觉醒“之中。如今，超越国家工团主义的思想已经到来，让我们消灭污染法兰西的不洁者！那些"Rosbif"(对英国人的蔑称，意为烤牛肉，嘲讽其饮食单调）；”Boche"(对德国人的蔑称，来源于allemand+caboche，意为阿勒曼尼鬼佬）；“Youpin”（犹太人的蔑称）以及其他一切危害法兰西的肮脏必须被清除！不过德国人在柯布西耶那里还是可以合作的，其“革命”的思想深刻影响了他。不过，在这些伟大愿景落实之前，先做第一件事吧！我们必须把伟大的最高设计师柯布西耶的家族谱系资料修改一下——其母系血统疑似有一些“不纯”？"
 COF_tech.3.a:0 "立刻把资料设为绝密"
 COF_tech.4.t:0 "Modulor(模度)"
 COF_tech.4.d:0 "纯粹主义的新城市当然要为“新人”服务，人必有所居之处，而所居之处即可反映其社会地位，进而为纯粹主义乌托邦的建设添砖加瓦。最高设计师柯布西耶同志已经以身高1.80米男性为标准，基于黄金比例设计了“模度”（Modulor）系统。多么优美，多么有序，多么震撼！这样的新建筑模式将会引领新的社会风潮！让我们打倒女性，控制儿童，消灭残障！为了实现这一目的，柯布西耶同志下令创立了ASCORAL（建筑革新建造者协会），这是一个跨学科技术官僚组织，旨在通过标准化解决城市化问题。皮埃尔·温特（PierreWinter）等技术官僚已经加入合作，通过工业化手段，我们将可以‘格式化人类生活’。"
 COF_tech.4.a:0 "§VTHE NEW ORDER IS COMING§!"
 COF_tech.5.t:0 "纯净之人"
 COF_tech.5.d:0 "亚历克西·卡雷尔，我们法兰西伟大的医学家，曾荣获1912年诺贝尔医学奖，他就是一位优生学倡导者，并成立了法国人类问题研究基金会。柯布西耶同志高度赞赏了他的工作。柯布西耶自己也思考了许多优生学概念，在1930年代，他就参加了杂志《计划》（Plans）和《前奏曲》（Prélude）的编辑工作。这些刊物宣扬通过技术官僚手段实现“人口优化”，正如皮埃尔·温特医生告诉他的那样：“我们和您今天的作用是恢复人类的自然，让人类融入其中。我们必须要让法兰西永远纯净！执行优生学必须成为基本国策！"
 COF_tech.5.a:0 "我们不能确定这样做的后果是什么……"
 COF_tech.5.b:0 "阻止该法案通过，我们不能学丹麦人那样！"
 COF_tech.6.t:0 "柯布西耶的新人类理论"
 COF_tech.6.d:0 "柯布西耶今天在大会上阐释了自己的“新人类思想”，体现为以下三点：\n①身体的几何化：通过模数系统将人体简化为可计算的机械单位。\n②社会的机器化：以功能主义城市规划消除个体差异，追求集体效率。\n③精神的秩序化：通过建筑空间规训人类行为与情感。\n\n这一理想既是纯粹主义乌托邦的巅峰，也是技术官僚威权的体现——通过建筑与设计创造“理性新人”。模度塑造完美个体，集体住宅构建秩序社会，美学创造时代精神！抛弃现代社会的污浊，我们将进入人类的巅峰时刻！"
 COF_tech.6.a:0 "极致之时将要来到……"
 COF_tech.6.b:0 "……此举迎来了勒伊德为首的技术官僚的反对，柯布西耶被围堵在门前，守卫充满电的电棍让他不得不承认自己在天马行空。" 
 COF_tech.7.t:0 "历史的终结"
 COF_tech.7.d:0 "我们宣告历史的终结，因为纯粹主义已经证明了它是人类思想的巅峰。公正合理的等级秩序之下，亿万充满阳刚之气的理性人民正辛勤劳作，为我们的事业添砖加瓦。看到现代城市巨兽的粗犷混凝土、巨型立柱与几何体量，人们又怎能不折服，不顺从呢？强权领袖和科学规划可取代民主的混乱，毕达哥拉斯传统与维特鲁威理论的结合使得我们战无不胜！时间仍旧会持续流动，但纯粹主义的时代将永存！"
 COF_tech.7.a:0 "我们将建构一切！"
 COF_tech.7.b:0 "悠着点来。"
 COF_tech.7.c:0 "……你动不动为非作歹的日子结束了，柯布西耶。"
 COF_tech.8.t:0 "柯布西耶的记录：让·库特罗的拜访"
 COF_tech.8.d:0 "那个COST的库特罗来了。他谈了些用机器和药物改造人体的想法，说什么“血肉苦弱”，想直接插手人的身体和脑子，追求所谓的“效率”和“超越”。\n他的想法…有吸引力。更快的思维，更强的身体，甚至为征服太空做准备——这些都符合法兰西引领未来的使命。效率也是秩序的一部分。\n\n但是。\n\n他说的这些改造，充满未知。它们能像我的建筑一样精确吗？能完全融入我设计的完美体系，成为严丝合缝的零件吗？会不会带来混乱？会不会破坏我们好不容易建立的纯洁和统一？\n他承诺这些技术能标准化、受控制，能清除人的弱点，服务集体目标，像规划城市一样“格式化”人类。"
 COF_tech.8.a:0 "可以观望，让他拿出具体、可控的方案。"
 COF_tech.8.b:0 "秩序，是唯一的真理。如果他的技术不能完美服务于此，那么它就没有存在的必要。"
 COF_tech.9.t:0 "柯布西耶的记录：让·库特罗的拜访"
 COF_tech.9.d:0 "库特罗又来了。他这次带着些……非同寻常的东西。不是图纸或公式，而是些古老的石头、骨头上的刻痕、甚至据说来自深山的巨大骸骨碎片。他声称这些不是神话，是证据——证明人类早已拥有超越凡俗的潜能，他所谓的“新人类”并非空想，而是……曾经存在过，甚至可能就在我们之中。\n这些异相……它们看起来杂乱无章，是自然的畸形？还是某种失控的力量？\n暂且不论这个，库特罗向我要钱。刚拿出些说不清道不明的“证据”，就要成立什么“科学特别搜查署”。经费、独立的机构、国际网络……这是在构建属于他自己的权力基础吗？”\n不过……他展示的“证据”里蕴含的可能性的确……诱人。他说有些外国佬也愿意跟他干，或许可以利用一下法伦斯泰尔国际的机构。\n经费？可以象征性给一点，证明理事会对科学探索的支持。特搜署？不允许独立架构。它必须是理事会下属的一个极小规模、高度保密的专项研究小组，由我信任的技术官僚直接领导。库特罗可以是个'顾问'，提供想法，但绝不能有独立行动权。"
 COF_tech.9.a:0 "柯布西耶仍然在思考……"
 COF_tech.10.t:0 "柯布西耶的记录：雷恩会议"
 COF_tech.10.d:0 "最终，还是批了那点钱给他。象征性的，够他折腾一阵，但别想养出什么不受控的怪物。\n但雷恩这场所谓的“国际科学交流会”？简直是场闹剧！\n什么科学家？分明是一群装神弄鬼的民俗学者！在纯粹主义追求几何精确与理性秩序的法兰西，这种故弄玄虚、谈论什么“传说中觉醒者”的行径，简直是污染！是对“科学”这个词的亵渎。库特罗竟和这种人为伍？他那“人类潜力”的宏伟叙事，基石就是这些都市怪谈吗？可笑，更可鄙。\n不过…钱既然批了少许，总得有个地方塞下他们。不能留在本土核心区。他们这股巫术般的气息会玷污我们纯粹的白。\n海峡群岛…完美。巴掌大的鬼地方，阴冷潮湿，隔着海峡，离我们本土够近够控制，却又足够远够隔离。名义上属于盎格鲁佬，但协约国的老间谍像老鼠一样在犄角旮旯里钻营。\n让库特罗带着他这帮“民俗学会”和搜集来的破烂传说，滚到那个小岛上去折腾吧。离我精心打造的秩序核心远点。他们要是真搞出点名堂，最终也是法兰西的成果。要是搞不出来，或者被那些阴魂不散的协约国间谍盯上、甚至“意外”消失…呵，那也省了我的事。"
 COF_tech.10.a:0 "柯布西耶写完后点了根雪茄。"
 COF_tech.11.t:0 "柯布西耶的记录：加尔各答事件"
 COF_tech.11.d:0 "加尔各答的接触事件已初步整理。勒菲弗的记录基本准确。\n那个女孩…一个显著的异常值。她的存在和感知能力，完全脱离了现有基于模度和优生学筛选的“理性新人”模型预期。她感知到了…本质。她触及了纯粹主义的核心矛盾：秩序对生命自发性（她称为“梦的味道”）的必然压制。这不是迷信，是一种近乎物理定律般的认知穿透力。\n这证明库特罗的核心假设存在某种…值得严肃考量的基础。他所追寻的“潜力”，那些看似玄学的报告，可能并非全部是民俗学家的呓语。人类系统存在着尚未被纯粹主义框架完全解释、甚至可能颠覆其基础的极端变量。\n库特罗的问题依旧显著：方法混乱，团队构成低劣（雷恩那帮人证明了这点），且与外国力量纠缠不清，但他的想法已经被加尔各答女孩所证实。理事会将直接派遣核心技术官僚和忠诚的安保力量接管项目日常运作与科研方向，希望库特罗别让我失望。\n风险极高。但加尔各答的接触证明，这种“潜力”本身就是一种秩序力量——一种我们尚未掌握，但必须掌握的力量。忽略它，比研究它更危险。"
 COF_tech.11.a:0 "柯布西耶拿起了烟斗，到窗边稍作休憩。"
 COF_tech.79.t:0 "档案编号：A7-019//事件：加尔各答接触//记录人：亨利·勒菲弗"
 COF_tech.79.d:0 "加尔各答。这名字本身在空气中就带着一种辛辣的热度，混杂着潮湿的海洋气息、燃烧的祭祀香料和工业化烟尘的刺鼻味道。婆罗多公社的经济心脏，一个在旧世界废墟上诞生的、充满矛盾活力的红色巨人。我们——法兰西技术官僚委员会的代表团——来到这里，交流印度城市改造的可行性。\n\n柯布西耶主席走在我们前面，他那标志性的圆框眼镜反射着刺目的白光，黑色西装笔挺得没有一丝褶皱，如同他追求的精神秩序。他正用低沉、精确如卡尺度量般的法语，向公社的几位技术官员阐述他对中心布局的改进意见。\n我作为他的随行专员，负责记录和协调，目光习惯性地扫视着周围的环境，评估着公社技术官僚们脸上微妙的表情：有敬畏，有困惑，也有一丝不易察觉的抵触。就在这例行公事的观察中，我的视线被远处一根巨大混凝土廊柱下的阴影吸引住了。\n\n那里站着一个女孩。\n\n大约十三四岁，裹着一件宽大、磨损的土黄色粗布袍子，与周围灰蓝色的建筑和制服格格不入。她的黑发在耳侧梳成两个略显松垂的团子发髻，几缕碎发散在额前。她的身形纤细，却并不显得柔弱，更像一株生长在混凝土缝隙里的坚韧植物。但最令人无法移开目光的，是她的眼睛。那是一种极其罕见的、近乎透明的琥珀色，像是凝固的阳光，明亮得惊人，又深邃得仿佛能倒映整个宇宙的星尘。她静静地站在那里，没有像其他好奇的孩子那样挤上前，只是安静地、毫不躲闪地凝视着我们——更准确地说，是凝视着主席。\n\n她的眼神里没有常见的怯懦或崇拜，而是一种……洞悉？一种穿透性的平静，仿佛我们这群西装革履、代表着世界最先进技术官僚体系的异乡人，在她眼中不过是舞台上的演员，而她早已看穿了所有的剧本。\n\n主席显然也注意到了她。他停下了讲解，微微侧过头，那审视的目光如同建筑师在评估一块待雕琢的石材。他锐利的视线扫过女孩的全身，似乎在进行某种无言的测量。\n\n“主席，可能是工人的孩子，或者……”我低声提醒，试图阻止他接近这个显然不在行程安排内的“变量”。\n\n但他只是轻轻抬手阻止了我未尽的话。他走到女孩面前几步远的地方，停下。他的影子像一堵沉重的墙，压在了女孩身上。"
 COF_tech.79.a:0 "继续查看"
 COF_tech.80.t:0 "档案编号：A7-019//事件：加尔各答接触//记录人：亨利·勒菲弗"
 COF_tech.80.d:0 "“孩子，”主席开口，他的法语带着浓重的瑞士口音，但每一个词都清晰、冰冷、没有起伏，“你在这里做什么？你的父母呢？”他使用的是法语，似乎笃定对方能理解。\n\n女孩没有回答。她仰起头，那双琥珀色的眼睛直视着主席隐藏在反光镜片后的双眼。那一刻，空气仿佛凝固了。她微微歪了歪头，像一个好奇的学者在研究一件奇特的标本。然后，一个极其细微的、几乎可以忽略不计的皱眉出现在她的额头。\n\n“他……很冷。”女孩的声音很轻，带着本地口音，但吐字清晰，用的是印地语。她身边并无旁人，这句话更像是自言自语，又像是对某个看不见的存在低语。\n\n主席的背脊似乎极其轻微地绷紧了一下。他镜片后的目光锐利如锥。“冷？”他用印地语反问，语速缓慢，带着探究的意味，“你是指温度？”\n\n女孩没有直接回答他的问题。她的目光越过了主席，落在了我身上。\n\n“你……害怕他，”女孩再次轻声说，目光回到主席身上，这次她使用的是法语，虽然发音有些生涩，但语义准确得令人毛骨悚然，“害怕他图纸里的线条……它们会勒死很多东西，不只是树，还有……梦的味道。”\n\n现场死寂一片。公社的官员们面面相觑，神情惊疑不定。我强压下心头的惊涛骇浪，强迫自己维持表面的镇定，但指尖已经冰凉。主席的反应却出人意料。他没有动怒，没有质疑，反而像是发现了稀世珍宝的考古学家。他向前又迈了一小步，弯下腰，仔细端详着女孩的脸庞，特别是那双异瞳。他甚至伸出修长的手指，极其克制而精准地，隔着几厘米的距离，在空中沿着女孩头颅和肩膀的轮廓虚划了一下，仿佛在测量一个完美的几何体。\n\n“勒菲弗！”他的声音带着罕见的、纯粹的兴奋，“去找一下这孩子的父母！” 接着他转向惊愕的当地官员，语气斩钉截铁：“这个女孩，关乎人类的未来。”\n女孩依旧平静地站在那里。她的目光再次投向了我。这一次，那穿透性的眼神中，似乎多了一丝难以言喻的悲悯，像星辰俯瞰着地面注定走向某种终结的蚁群。她微微抿了抿唇，无声地，却清晰地在我混乱的意识中“印”下了一句并非通过耳朵听到的话：\n\n “钢铁的鸟巢……困不住会飞的心。”"
 COF_tech.80.a:0 "这份自述档案下面盖着柯布西耶和库特罗两个人的章，被列为绝密。"
