 INT_SSSP_formed:0 "第三国际内的国家将建立§V科学特别搜查署§!"
 INT_SSSP_goal:0 "§1君往何方……§!"
 INT_SSSP_goal_desc:0 "在经历了一系列超自然事件后，巴黎决定在海峡群岛设置第三国际科学特别搜查署，以科学研究为名，调查相关事件的真相。"
 COF_redflood.1.t:0 "超现实主义社团要求西蒙娜·薇依下台"
 COF_redflood.1.d:0 "西蒙娜·薇依的过激行为让他的许多政治盟友不满，纷纷与其决裂。而超现实主义社团就是其中之一，其社长布勒东公开指责了西蒙娜·薇依企图在革命的中心复辟旧秩序，刻意打压先锋艺术的发展，让人们重归愚昧，陷入资本主义的骗局。超现实主义社团将与其他革命者抵抗到底，不惜一切代价让西蒙娜·薇依下台。\n布勒东的底气并非口血来潮。据可靠消息称，他拉拢了劳总联中的异见者，并秘密保护了一批索雷尔激进分子。巴黎附近的民兵在秘密集结，随时支持布勒东发动一场政变……"
 COF_redflood.1.a:0 "将这帮无所事事者开除出议会！"
 COF_redflood.1.b:0 "别这样，我们都可以谈，不是吗？"
 COF_redflood.2.t:0 "超现实主义社团发动政变"
 COF_redflood.2.d:0 "布勒东"
 COF_redflood.2.a:0 "布勒东同志英明！"
 kxxfrance.100.t:0 "可能派之下的民主选举"
 kxxfrance.100.d:0 "共和国将按照恢复旧制，进行五年一次的选举。工团主义、无政府主义和索雷尔主义的阴霾已经远离了新的社会主义联盟，政权将掌握在雷诺德尔、戴亚为首的法兰西社会党，弗朗索瓦·勒伊德为首的共治运动技术官僚集团，以及前共和社会党与工人国际法国支部的温和派们手中。"
 kxxfrance.100.a:0 "社会党取胜"
 kxxfrance.100.b:0 "共治运动取胜"
 kxxfrance.100.c:0 "劳工民主联合会取胜"
 kxxfrance.101.t:0 "社会党候选人"
 kxxfrance.101.d:0 "选票稳稳地攥紧在我们社会党手中，我们将在戴亚同志、马凯同志和雷诺德尔同志之中选择一名新领袖！"
 kxxfrance.101.a:0 "恭喜戴亚同志！"
 kxxfrance.101.b:0 "恭喜雷诺德尔同志！"
 kxxfrance.101.c:0 "恭喜马凯同志！"
 kxxfrance.101.e:0 "恭喜来自比利时的德·曼同志成为黑马！"
 kxxfrance.102.t:0 "共治运动候选人"
 kxxfrance.102.d:0 "X-危机小组是由出身巴黎综合理工学院的经济理论家们组成的技术官僚运动，他们从提高国家的整体运行效率出发，主张计划经济和科技兴国。长期被许多偏执的公社成员视为阴谋论的共治运动因为我们政策的放宽，焕发了又一春，他们主动攀附了戴亚的势力，在经济规划方面贡献出了自己的力量与专业学识，弗朗索瓦·勒伊德领导下的新派系也就此而来。这一派系的成员分别是受到美国伯纳姆主义启发的雷蒙德·阿隆、现代主义建筑师勒·柯布西耶、温和的乌托邦技官主义者弗朗西斯·德拉西、超人类主义者让·库特罗以及抱有圣西门理想的皮埃尔·普丘。"
 kxxfrance.102.a:0 "恭喜勒伊德同志！"
 kxxfrance.102.b: "恭喜阿隆同志！"
 kxxfrance.102.c: "恭喜柯布西耶同志！"
 kxxfrance.102.e: "恭喜德拉西同志！"
 kxxfrance.102.f: "恭喜库特罗同志！"
 kxxfrance.102.g: "恭喜普丘同志！"
 kxxfrance.103.t:0 "劳工民主联合会候选人"
 kxxfrance.103.d:0 "劳工民主联合会这一派即所谓“左翼卡特尔”，主要是共和社会党领袖约瑟夫·保罗-邦库尔与工人国际法国支部领袖保罗·福尔所牵头组成的一个前公社体制内的政治联盟，受到代表农村利益的基督教劳工联合会和加斯东·维达尔的退役军人联合会支持。马塞尔·戴亚曾经也是他们的一员。虽然对他们的懦弱行为非常抵触，但真正的社会主义联盟框架下也需要他们的助力。值得注意的是，在这次选举中，全世界无产阶级和劳动人民的革命导师卡尔·马克思的外孙，工人国际法国支部的高层让·龙格也宣布参选，情况变得更有意思起来了。"
 kxxfrance.103.a:0 "恭喜古安同志！"
 kxxfrance.103.b:0 "恭喜布鲁姆同志！"
 kxxfrance.103.c:0 "恭喜奥里奥尔同志！"
 kxxfrance.103.e:0 "恭喜赖伐尔同志！"
 kxxfrance.103.f:0 "恭喜摩勒同志！"
 kxxfrance.103.g:0 "下一页"
 kxxfrance.104.t:0 "劳工民主联合会候选人"
 kxxfrance.104.d:0 "劳工民主联合会这一派即所谓“左翼卡特尔”，主要是共和社会党领袖约瑟夫·保罗-邦库尔与工人国际法国支部领袖保罗·福尔所牵头组成的一个前公社体制内的政治联盟，受到代表农村利益的基督教劳工联合会和加斯东·维达尔的退役军人联合会支持。马塞尔·戴亚曾经也是他们的一员。虽然对他们的懦弱行为非常抵触，但真正的社会主义联盟框架下也需要他们的助力。值得注意的是，在这次选举中，全世界无产阶级和劳动人民的革命导师卡尔·马克思的外孙，工人国际法国支部的高层让·龙格也宣布参选，情况变得更有意思起来了。"
 kxxfrance.104.a:0 "恭喜龙格同志！"
 kxxfrance.104.b:0 "恭喜里贝斯同志！"
 kxxfrance.104.c:0 "恭喜邦库尔同志！"
 kxxfrance.104.e:0 "恭喜富尔同志（保罗）！"
 kxxfrance.104.f:0 "恭喜维达尔同志！"
 kxxfrance.104.g:0 "恭喜泰西耶同志！"
 kxxfrance.105.t:0 "宣布夺取政权？"
 kxxfrance.105.d:0 "共治运动虽然取得了胜利，但是被其他政治势力所仇恨。雷诺德尔让民主政党回归选举是个错误的决定，而我们的直接盟友马塞尔·戴亚更是权威受损。既然戴亚现在不愿意出面，那么我们就替他出面终结这一切？"
 kxxfrance.105.a:0 "我们需要几个更支持技术官僚的政府，而不是民主过家家。"
 kxxfrance.105.b:0 "不要试图动摇共和国的根基，我们毕竟是爱国者！"
 kxxfrance.106.t:0 "西蒙娜，君往何方？"
 kxxfrance.106.d:0 "现在我们已经基本摆平了索雷尔激进分子的抵抗，戴亚和他的群体也缄默地体验着社会百态，各司其职。西蒙娜·薇依望着此番景象却仍有忧虑，她被支持者称赞为义人，但她并不是一个有经验的政治家。如今的公社联邦中，新的政治势力已经在主的名义下逐渐形成，泰西耶和劳总联的残余派、雅各宾的温和派、基督教民主主义者、新教徒等等都粉墨登场，都希望西蒙娜能够给予他们施展拳脚的机会。政治的勾心斗角让西蒙娜沉醉于灵性的探究，寻求神秘主义体验以摆脱世俗牵绊，但在探究之后，又不得不面对现实。或许，应该考虑在主的荫蔽下，公社联邦的未来了。"
 kxxfrance.106.a:0 "重建一个温和且革命的劳总联"
 kxxfrance.106.b:0 "革命需要向上更进一步，和激进派联合"
 kxxfrance.106.c:0 "社会天主教的民主主义是现在需要的"
 kxxfrance.106.e:0 "与普世主义的新教义人们同行，弥合世间分裂"
 kxxfrance.106.f:0 "……深入灵性的探讨，仪式是革命的起源"
 kxxfrance.107.t:0 "天主福报下的选举：劳总联"
 kxxfrance.107.d:0 "总工会在薇依和泰西耶两位同志下重建，让上帝的福音和工团主义有机结合在一起吧！新一届劳总联的主席是……"
 kxxfrance.107.a:0 "恭喜薇依同志！"
 kxxfrance.107.b:0 "恭喜泰西耶同志！"
 kxxfrance.107.c:0 "恭喜齐尔纳德同志！"
 kxxfrance.107.e:0 "恭喜马努尚同志！"
 kxxfrance.107.f:0 "恭喜弗勒奈同志！"
 kxxfrance.107.g:0 "恭喜加缪同志！"
 kxxfrance.107.h:0 "恭喜埃卢尔同志！"
 kxxfrance.108.t:0 "天主福报下的革命"
 kxxfrance.108.d:0 "耶稣也是工人的儿子，他是历史上的革命先驱者，法兰西的新知识分子们如此谈到。我们将在一名左翼作家中选择革命的领袖，让神学也成为人类解放的一环。"
 kxxfrance.108.a:0 "推举西蒙娜·薇依"
 kxxfrance.108.b:0 "推举罗曼·罗兰"
 kxxfrance.108.c:0 "推举西蒙德·波伏娃"
 kxxfrance.108.e:0 "推举让-保罗·萨特"
 kxxfrance.108.f:0 "推举保罗·尼赞"
 kxxfrance.108.g:0 "以阿尔贝·加缪、雅克·埃卢尔为代表的知识分子仍然支持恢复劳总联！"
 kxxfrance.109.t:0 "天主福报下的选举：犁沟运动的遗产"
 kxxfrance.109.d:0 "“Le Sillon” (1894-1910) 是由马克·桑尼创立的一个天主教社会运动。该运动旨在促进社会正义、民主价值观以及天主教教义与现代社会的调和。虽然没有得到广泛的认可，但是作为社会基督教运动历史上的一次尝试，值得去铭记。现在，马克·桑尼先生的青年共和联盟将会打造一个激进主义的天主教共和国，下一届总统是……"
 kxxfrance.109.a:0 "恭喜马克·桑尼先生"
 kxxfrance.109.b:0 "恭喜奥古斯特·里贝斯先生"
 kxxfrance.109.c:0 "恭喜安德烈·菲利普先生"
 kxxfrance.109.e:0 "恭喜勒内·科皮坦先生"
 kxxfrance.110.t:0 "天主福报下的选举：新教联盟"
 kxxfrance.110.d:0 "16世纪法国宗教改革催生了以加尔文主义为主的胡格诺派（Huguenots），曾占人口10%，建立独立教会和军事力量，但持续性地遭到破坏。1685年路易十四废除宗教宽容法令，新教被禁，教堂摧毁，信徒被迫改宗或流亡，直到1802年拿破仑通过《教务专约》承认新教为国家管控的"公认宗教"。1905年，第三共和国发布《政教分离法》废除国家宗教资助，新教彻底脱离政教合一体系，转向自由教会模式。一些有识之士参与到了社会基督教的运动当中，为普世主义作出了很大的贡献。现在国家交予新教联盟的手中，下一届的主教是……"
 kxxfrance.110.a:0 "马克·博埃格纳"
 kxxfrance.110.b:0 "威尔弗雷德·莫诺"
 kxxfrance.110.c:0 "安德烈·特罗克梅"
 kxxfrance.111.t:0 "沉醉于灵性的密教社团"
 kxxfrance.111.d:0 "西蒙娜·薇依一直以来对神秘主义感兴趣，尤其是基督教神秘主义。当然，她也涉猎了许多东方的宗教，古希腊的，埃及的，印度教甚至是道教的。她认为这些宗教的灵性，也是通往基督教本源的一部分。现在，西蒙娜可以选择她的新盟友们，来继续深入探索这一灵性的奥妙……"
 kxxfrance.111.a:0 "我们将和基督教神秘主义者们走向未来"
 kxxfrance.111.b:0 "同德雷福斯夫人的巴哈伊社团结成联盟"
 kxxfrance.111.c:0 "古希腊奥妙"
 kxxfrance.111.e:0 "佛教"
 kxxfrance.111.f:0 "印度教"
 kxxfrance.111.g:0 "道教"
