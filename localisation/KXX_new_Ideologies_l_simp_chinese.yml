 tot_socialism_with_chinese_characteristics_subtype:0 "中国特色社会主义"
 tot_socialism_with_chinese_characteristics_subtype_desc:0 "§Y中国特色社会主义§!\n\n£GFX_ideology_socialism_with_chinese_characteristics_bar\n\n\n\n\n又称“具有中国特色的社会主义”、“中特社”。其是科学社会主义的基本原则与中国实际相结合的产物，具有鲜明的时代特征和中国特色，最本职的特征是中国共产党的领导。\n中国特色社会主义道路，是在中国共产党的领导下，立足基本国情，以经济建设为中心，坚持四项基本原则，坚持改革开放，解放和发展社会生产力，建设中国特色社会主义市场经济、社会主义民主政治、社会主义先进文化、社会主义和谐社会、社会主义生态文明，促进人的全面发展，逐步实现全体人民共同富裕，建设富强、民主、文明、和谐、美丽的社会主义现代化强国。中国特色社会主义道路，是党和人民100年奋斗、创造、积累的根本成就，是引领中国进步、增进人民福祉、实现民族复兴的康庄大道。"
