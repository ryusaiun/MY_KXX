 #伊朗扩展
 pataut_zoroastrianism_subtype:0 "琐罗亚斯德教"
 pataut_zoroastrianism_subtype_desc:0 "§Y琐罗亚斯德教（Zoroastrianism）§!\n\n琐罗亚斯德教，又称祆教、火祆教、拜火教，是世界上最古老的宗教之一。由先知琐罗亚斯德在远古时代创立，以光明与黑暗的永恒对立为核心。\n\n在其教义中，至高神阿胡拉·马兹达被奉为光明的化身，宇宙的创造者。他象征着一切美好与正义，指引着信徒们走向真理的道路。与之对立的，是恶神安格拉·曼纽，黑暗与混乱的象征。\n\n虽然其曾一度在历史长河中销声匿迹，但在拉曼·阿契美尼德一世的带领下，琐罗亚斯德教已重获新生。如今，信徒们仍仿照旧时，在火光下祈祷，铭记着那种古老的信仰之光，努力在纷扰的世界中维系与阿胡拉·马兹达的神圣联系。"
 pataut_paniranism_subtype:0 "泛伊朗主义"
 pataut_paniranism_subtype_desc:0 "§Y泛伊朗主义（Pan-Iranism）§!\n\n泛伊朗主义是一种存在于中亚地区的意识形态，旨在提倡居住于伊朗高原及其它经受伊朗文化影响之地域的伊朗民族之间的团结与统一。这一概念涉及到多个族群，包括波斯人、阿塞拜疆人、奥塞梯人、库尔德人与扎扎人；分布在塔吉克斯坦、乌兹别克斯坦与阿富汗的塔吉克人；以及巴基斯坦的普什图人和俾路支人。"
 orphism_subtype:0 "俄耳甫斯教"
 orphism_subtype_desc:0 "§Y俄耳甫斯教§!\n\n£GFX_ideology_orphism_bar\n\n\n\n\n俄耳甫斯教是发源于古希腊与希腊化时代的、色雷斯人的信仰与习俗。到冥府接回欧律狄刻的诗人俄耳甫斯的传说与其直接相关联。这一教派声称其为“狄俄倪索斯秘仪”的改革教派，重新释义了狄俄倪索斯神话，并对赫西俄德的作品《神谱》做了重新编排。\n俄耳甫斯认为人类天生具有两重性：1.身体（sōma），这部分是继承于提坦；2.神圣的火光或灵魂（psychē），则是继承自狄俄倪索斯。人们为了要从提坦所继承的物质性的存在──肉体之中获得救赎，必须要先进入狄俄倪索斯秘仪启蒙仪式，然后还要经历一段领悟（teletē）过程，这是对于主神狄俄倪索斯的磨难和死亡的一种净化还有解脱的仪式。总而言之，狄俄尼索斯秘仪给予信徒来世能够往生至福乐土的承诺。"
 byronism_subtype:0 "拜伦主义"
 byronism_subtype_desc:0 "§Y拜伦主义§!\n\n拜伦主义被不同地定义为一种生活方式、据称是“拜伦文本的一系列特征”或他的标志性英雄，或“使拜伦成为英国名人的发展”。这种文化现象极大地改变了作者、文本和受众之间的关系，其回响远远超出了英国文化的惯常影响范围。它起源于乔治·戈登·拜伦勋爵刻意创造的一种独特而明显的诗歌主观性，它依赖于一种精心维持的观点潮流，根据这种观点，拜伦的诗歌实际上是他内心深处的迷恋和磨难的表达，以及他的思想。英雄都是面具，在面具后面只有诗人自己……"
 radsoc_byronism_subtype:0 "拜伦主义"
 radsoc_byronism_subtype_desc:0 "§R拜伦主义§!\n\n拜伦主义被不同地定义为一种生活方式、据称是“拜伦文本的一系列特征”或他的标志性英雄，或“使拜伦成为英国名人的发展”。这种文化现象极大地改变了作者、文本和受众之间的关系，其回响远远超出了英国文化的惯常影响范围。它起源于乔治·戈登·拜伦勋爵刻意创造的一种独特而明显的诗歌主观性，它依赖于一种精心维持的观点潮流，根据这种观点，拜伦的诗歌实际上是他内心深处的迷恋和磨难的表达，以及他的思想。英雄都是面具，在面具后面只有诗人自己……"
 ###A.A.P.A
 kwantang_Junta_subtype:0 "关东军殖民政府"
 kwantang_Junta_subtype_desc:0 "§Y关东军殖民政府§!\n\n关东军是为了保卫第一次日俄战争期间在满洲取得的胜利而成立的，但现在已演变成日本政治中独立的参与者。关东军是皇道派的据点，里面充满了各种军国主义者，在郭松龄叛乱之后，关东军成为日本最负盛名的职位之一，并在奉天政府中站稳了脚跟。随着关东军对美国的新控制，军国主义者得以在美国建立新的军国主义国家，其丰厚的财富将确保日本继续保持经济增长和国家主导地位。"
 reform_bureaucracy_subtype:0 "改革官僚体制"
 reform_bureaucracy_subtype_desc:0 ""§Y(改革官僚体制)§!\n\n改革官僚体制是各行各业技术官僚的联合意识形态，旨在通过建立管理型政府来消除资本主义的低效性。通过部分指令性经济，这个管理型政府寻求消除垄断、自我致富和短视造成的低效性，以创建一个致力于支持大日本帝国全面战争的经济。与改革官僚似乎模仿的世界上各种左派不同，官僚否认阶级冲突，将民族斗争视为最重要的斗争，寻求建立阶级合作。"
 #KXX彩蛋内容
 ikemenjoshism_subtype:0 "美青年女子至上"
 ikemenjoshism_subtype_desc:0 "§Y美青年女子至上§!\n\n£GFX_ideology_ikemenjoshism_bar\n\n\n\n\n外表帅气，有中性魅力的女性应该被称为什么？对此人们并未有一个统一的称呼。或有人举起假小子的大旗，将青春的热烈融入蓝天碧海；或有人为姐系的温柔乡所牵绊，托出母性的光辉；或有人携着王子系的玉锦，高唱万众瞩目的魅力之歌……性别的界限在恰到好处裂开了一道口，流入心房产生的悸动，让人们感到发热，以至于忘却了该如何描述她们的美。\n“帅气”虽然千百年来被用来形容女子，但随着时代发展，未尝不能拓展它的所指。「イケメン女子」（美青年女子）便是这样的一个概念。五官立体、轮廓分明，带有传统认知中的男性化帅气感，举止洒脱自信，兼具女性的柔美与中性化的飒爽。这种风格为何不能被称之为“美青年”呢？这一符号不仅适用于女孩，也适用于成年后的女性，并且也可以用在那些“冰冷美女”的身上，尽可能地将所有“酷酷的女人”纳入它的所指范围之内。\n美青年女子在现代越来越得到了关注，她们是传统框架的挑战者，她们勇敢地在流动的身份符号中寻找真正的自我。强大而自信的女子是值得人们去尊敬且热爱的，「美青年女子至上」理念，正是要将这种魅力与精神作为榜样，以期掀起新一轮的变革。"
 soclib_ikemenjoshism_subtype:0 "美青年女子至上"
