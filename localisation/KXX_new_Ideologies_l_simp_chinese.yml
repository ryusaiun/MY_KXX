 paternalistic_reactionaryism_subtype:0 "家长式反动主义" 

 paternalistic_reactionaryism_subtype_desc:0 "§Y家长式反动主义§!\n\n£GFX_ideology_paternalistic_reactionaryism_bar\n\n\n\n\n家长式反动主义是一种威权主义的、经济上中左、文化上极右且反动的意识形态，它是反动主义与社会威权主义的综合体。\n与其它社会民主主义意识形态类似，它支持通过严格管制的经济体系、庞大的福利国家以及对工会的支持来实现其主张。然而，与持有相同经济体系的其他意识形态不同，其理论基础并不相同——它并非基于平等或其他现代理念，而是可能以宗教或反自由主义来为其经济政策辩护。\n由于其反动本质，它反对民主制度，转而追求一种反民主的治理体系，往往同军国主义或君主主义进行合流。这一思想体系在理论上可追溯至19世纪的神权君主论与国家社会主义实践，如约瑟夫·德·迈斯特强调的神圣等级秩序，以及俾斯麦时期通过社会福利缓解阶级矛盾的策略，同时汲取了20世纪天主教统合主义中将宗教伦理嵌入国家机器的经验。\n这一意识形态在那些被现实撕裂理想的社会民主主义者中十分常见，往往是一个过渡状态，最终发展成威权社会民主主义或是堕入国家民粹主义的深渊。" 

 poeticized_liberalism_subtype:0 "诗学化政治"
 poeticized_liberalism_subtype_desc:0 "§Y诗学化政治§!\n\n£GFX_ideology_poeticized_liberalism_bar\n\n\n\n\n“诗学化政治”是对蒙德的现任阿其翁、高天的歌者、持『巴巴托斯』之名的风之精灵温迪朴素思想的提炼。虽然其未对政治有过多的参与，但作为吟游诗人对自由诗歌的传颂，温迪影响了一代又一代蒙德之子。诗学化政治并非只有儿女情长和歌舞笙飞，对苦寒袭来的恐惧是这一理念的末日观。风被天地所紧紧约束着，但它又是天地间最不肯受驯伏的事物，是不消失不碎裂的自由。从最初苦行雪原的古恩希尔德到流浪异乡的温妮莎，每个“浪子”都在独特的看护体制下，践行“诗意自由”这一理念，保持着与不美好、不自由、不浪漫事物的斗争，用诗化的誓言将美善、真情、欢乐留与世间。\n\n§5“谁也没有见过风，\n\n更别说我和你了。\n\n谁也没有见过爱情，\n\n直到有花束抛向自己。”§!"  

 ustase_subtype:0 "乌斯塔沙"
 ustase_subtype_desc:0 "§Y乌斯塔沙§!\n\n£GFX_ideology_ustase_bar\n\n\n\n\n乌斯塔沙宣扬克罗地亚民族独立，不同于革命乌斯塔沙那样左倾，乌斯塔沙完全就是一个彻头彻尾的右翼意识形态，为了使克罗地亚人从外族人的压迫中独立出来，可以使用任何手段，包括但不限于刺杀当地官员、自杀式恐怖袭击、大规模的摧毁外族人的定居点。一战之后在伊利里亚的控制下，乌斯塔沙渐渐销声匿迹，因为大部分成员认为克罗地亚已争取到独立，但是近几年来随着奥地利帝国不断的加强帝国议会的掌控力，乌斯塔沙再次冒了出来，他们宣布这一次将完全的把克罗地亚从奥地利的手里解救出来。"

 national_programmatism:0 "民族纲领主义"
 national_programmatism_desc:0 "§Y民族纲领主义§!\n\n£GFX_ideology_national_programmatism_bar\n\n\n\n\n纲领主义是由米哈伊尔巴枯宁的“组织二元论”发展而来，因内斯托尔.马赫诺在俄国内战期间的实践闻名的一种无政府共产主义派别。纲领主义支持生产资料公有制，鼓励工人反抗国家和资本主义，反对俄罗斯共产主义者的专政倾向。纲领主义者认为在彻底击败国家前，革命者应基于自愿原则加入一个服从多数原则的委员会，实现过渡时期的无产阶级专政并在军事和经济等方面服从委员会的调遣。\n民族纲领主义是纲领主义在内斯托尔马赫诺在乌克兰的革命实践中产生的变种。首先，在纲领主义运动早期，军事指挥部高层对于乌克兰文化的保护和广大乌克兰工农的自然的爱国主义热情就已经使得革命颇具乌克兰民族风格，而随后自由地区出于保护革命的需要吸收了民族共产主义武装后，纲领主义运动更是迅速且彻底地倒向民族主义——从要求废除民族，废除边界转而改为要求实现乌克兰民族独立，建立一个委员会共产主义国家。在自由地区沦陷后，马赫诺逃往了法兰西公社，战间期波兰地主压迫西乌克兰农民和德国盘剥乌克兰农业经济等事实刺激了马赫诺进一步转向民族主义。甚至有人说马赫诺本人直接参与了乌克兰民族主义组织的建立。\n民族纲领主义者被共产主义者指责为有帝国主义作风，被无政府主义者指责为有波拿巴倾向，而他们认为这些评价与乌克兰祖国相比不名一文。民族纲领主义者恪守马赫诺的宣言，永远作为民族独立与社会革命的先锋：没有民族解放，乌克兰人民的社会解放是不可能的，社会和民族解放的实现将取决于乌克兰人在乌克兰的统治！"

 pataut_eternal_revolution:0 "永恒革命"
 pataut_eternal_revolution_desc:0 "§Y永恒革命§!\n\n£GFX_ideology_eternal_revolution_bar\n\n\n\n\n永恒革命是乌克兰民族主义组织舒赫维奇派主张的意识形态。革新永恒革命反资本主义，反自由主义，反神秘主义，反社会主义，支持狂热的军国主义与民族仇恨，认同严格基于种族的民族主义。\n舒赫维奇派认为班德拉的思想过于激进，过于亲近社会主义，认为东佐夫的思想过于晦涩，无法指导乌克兰民族革命的现实，唯有非意识形态的军国主义与种族主义才能实现民族革命。永恒革命认为乌克兰民族的复兴必须浸透异族与叛徒的鲜血。\n罗曼舒赫维奇，沃伦大屠杀的直接指挥者，除了少数同样疯狂的极端民族主义者将他奉为英雄外，世人都认为这是一头凶狠的野兽，一个纯粹的刽子手。舒赫维奇毫不在意这些评价，他已经将生命交付给乌克兰民族的革命事业，如果乌克兰自由的代价是死一万人就让他死一万人，如果乌克兰自由的代价是世界变成白地就让他如此。"

