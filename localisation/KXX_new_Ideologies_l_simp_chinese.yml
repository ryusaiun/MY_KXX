 buddhist_anarchism_subtype:0 "佛教无政府主义"
 buddhist_anarchism_subtype_desc:0 "§Y佛教无政府主义§!\n\n£GFX_ideology_buddhist_anarchism_bar\n\n\n\n\n佛教和无政府主义似乎是奇怪的床伴搭配，但在当代东方的思想熔炉中并非少见。其核心在于以佛学根本戒律解构国家暴力与资本压迫的合法性，并依托原始僧团的平等实践构建出一个理想的非强制社会。普遍地，佛教无政府主义批判剩余价值剥削与土地私有化，主张以互助共享替代资本积累，希望回归佛陀“修行四资具”的普世保障原则，强调唯有满足基本生存需求，个体方能实践佛法并实现精神解脱。佛教无政府主义者批判国家干预而导致的现代僧团等级异化，呼吁剥离政教合流的枷锁，重建无国家、无监控、无监狱的修行共同体，使物质自主与精神自由互为基石——此即“苦谛觉醒”的真正前提。当暴力与欺骗的社会结构瓦解后，个体方能在自主实践中超越尘世之苦。"

 socdem_burnhamite_thought_subtype:0 "温和伯纳姆思想"
 socdem_burnhamite_thought_subtype_desc:0 "§Y温和伯纳姆思想§!\n\n£GFX_ideology_moderate_burnhamite_thought_bar\n\n\n\n\n温和伯纳姆思想是对詹姆斯·伯纳姆技术官僚理论的重构，剥离其激进政治主张，聚焦于科层效能与经济治理的现代化方案。该思想以伯纳姆《管理革命》的核心洞见为基础，承认专业管理者群体在现代工业社会中的结构性地位，主张通过系统性赋权技术官僚优化国家治理能力，但严格限定其职能于经济规划与行政执行领域。\n在经济架构上，该模式推行计划主导的混合体制：国家通过战略产业署等专业机构实施宏观引导，协调私营企业与公共部门的协作关系；以动态税收政策与定向补贴推动财富再分配，重点保障医疗、教育及基础设施的公共供给；同时设立独立监管委员会遏制垄断，维护市场创新活力。社会政策则依托职业化工会联盟，建立劳资政三方协商机制，实现工资标准、劳动保障与社会福利的契约化平衡，避免工团主义的对抗性冲突。\n而在政治上，温和伯纳姆思想反对权力集中化，主张专业化科层与代议制民主的融合：技术官僚机构仅作为立法机构的政策智库与执行助手，负责提供实证研究与方案评估；国会保留预算审批与政策终审权，并通过透明化听证机制监督技官体系运作。社会动员机制摒弃个人崇拜与监控手段，转而依赖公民参与式治理平台，推动政策反馈的制度化渠道建设。"

 radsoc_boer_nationalism_subtype:0 "布尔民族主义"
 radsoc_boer_nationalism_subtype_desc:0 "§Y布尔民族主义§!\n\n布尔民族主义，或称非洲白人民族主义，是一种南非的民族主义意识形态，扎根于自认为是南非真正的居民的非洲白人群体。这些布尔白人排斥土著和英国殖民者，并热切地谈论布尔人在非洲的光辉历史——从大迁徙到布尔战争。这种意识形态往往主张某种形式的种族隔离，并钟情于南非荷兰语。从革命左翼主义到右翼民粹民族主义，各种政党都有实践这一意识形态的，但也确实存在更温和的信奉者，尽管布尔民族主义如今的核心无疑是以詹姆斯·赫尔佐格和丹尼尔·弗朗索瓦·马兰博士为代表的国民党。"