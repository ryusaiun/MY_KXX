 left_militarism_subtype:0 "左翼沙文主义"
 left_militarism_subtype_desc:0 "§Y左翼沙文主义§!\n\n£GFX_ideology_left_militarism_bar\n\n\n\n\n左翼沙文主义是指一种在左翼政治立场下，将本国、本民族或本群体优越于其他群体，并带有一定程度的扩张主义和侵略倾向的观点。它与传统意义上的沙文主义（即极端的、不合理的爱国主义或民族主义）有所不同，但同样带有排他性和歧视性。左翼沙文主义将这种优越感和排他性与左翼政治理想相结合。例如，一些左翼政党或团体可能认为自己的国家或民族代表着“真正的社会主义”，并以此为由，对其他国家或民族进行干涉或压迫。"
 otokonomusumeism_subtype:0 "伪娘风徽"
 otokonomusumeism_subtype_desc:0 "§Y伪娘风徽§!\n\n£GFX_ideology_otokonomusumeism_bar\n\n\n\n\n在现代，“伪娘”这一词汇由日语“男の娘”意译而来。但随着时代发展，口语化的表达中已经被“男娘”这一称谓所代替。除此以外还曾经有“娘娘腔”、“女装美少年”、“第三性”、“萝莉正太”等称呼。从严谨的角度讲，伪娘指的是外表看起来像"可爱的少女或美丽的少女"的男性（此处"少女"指年轻女性）。这一概念源于成人游戏界对恋爱喜剧作品中伪娘角色的演变。如今已广泛渗透到女性向作品、一般向作品、BL（男男恋爱）、正太（少年向）等多种领域。\n虽然"伪娘"概念源于女装角色的演变，但由于其聚焦于「外貌呈现女性特征」这一核心要素，实际上不再强制要求角色进行女装（当然仍需要具备少女般的外貌）。不过值得注意的是，尽管并非必要条件，这类角色依然频繁采用女装造型——这是因为女装在某种程度上承担着维系女性特质的保障作用。\n日本学界普遍主张「伪娘」≠「跨性别者」。但随着现代研究发展，过度异性装扮癖好（超出兴趣范畴）已被心理学/精神医学界视为难以固守男女二元框架的"非二元性别"类型，此类案例实质上已纳入"LGBTQ+"范畴。\n随着性别少数群体研究深化，2010年代起逐渐形成「异性装扮癖存在突破二元框架的可能」的共识。恰逢日本动画通过流媒体全球化传播，导致海外观众对"伪娘"概念的认知混乱。\n但总的来说，伪娘仍然可被定义以下三类经典案例：因社会压力长期女装但性取向认同清晰的崩溃型角色、自主选择女装拒绝性别束缚的自由派角色、对自身特质认知模糊的探索型角色。"
 lu_xun_thought_subtype:0 "鲁迅思想"
 lu_xun_thought_subtype_desc:0 "§Y鲁迅思想§!\n\n£GFX_ideology_lu_xun_bar\n\n\n\n\n鲁迅思想是中国著名左翼作家鲁迅的意识形态。鲁迅特别重视无产阶级的思想解放，尤其重视打破封建主义、帝国主义对无产阶级的思想枷锁。鲁迅思想对于社会治理的观点类似于工团主义和较温和的共产主义派别，但尤其重视对个人思想的自由表达。"
 radsoc_lu_xun_thought_subtype:0 "鲁迅思想"
 radsoc_lu_xun_thought_subtype_desc:0 "§Y鲁迅思想§!\n\n£GFX_ideology_lu_xun_bar\n\n\n\n\n鲁迅思想是中国著名左翼作家鲁迅的意识形态。鲁迅特别重视无产阶级的思想解放，尤其重视打破封建主义、帝国主义对无产阶级的思想枷锁。鲁迅思想对于社会治理的观点类似于工团主义和较温和的共产主义派别，但尤其重视对个人思想的自由表达。"
 ingsoc_subtype:0 "英格兰社会主义"
 ingsoc_subtype_desc:0 "英格兰社会主义，或被简称为英社（INGSOC），描述了一种在大洋国（Oceania）运行的意识形态。这是一种超级的极权主义和集体主义，英社完全抹除所有个人思想，确保执政党的生存。而“老大哥”的国家机器正在开发新语言，身份和思维方式，以确保没有欧洲人会反抗他的统治。"
 tot_sansepolcrismo:0 "圣墓主义"
 tot_sansepolcrismo_desc:0 "圣墓主义并非欧洲的独特思想。它的诞生是在第一次世界大战期间贝尼托·墨索里尼的头脑中， 并在战后得到完善，最终成为意大利的指导思想。这种思想具有高度的极权主义和激进性，意图通过军事和外交手段，将意大利文化重塑成前所未有的事物，开启新的文艺复兴并将意大利带回其辉煌。 \n\n圣墓主义不会成为历史留下的无名之辈。由于其高度的适应性，它可能成为世界各地社会主义主要学派之一。由于索雷尔主义和莫斯利主义等意识形态的普及，以及民族布尔什维克主义思想在俄罗斯的兴起，我们可以看到对民族社会主义思想的高需"
 radsoc_sansepolcrismo:0 "圣墓主义"
 radsoc_sansepolcrismo_desc:0 "圣墓主义并非欧洲的独特思想。它的诞生是在第一次世界大战期间贝尼托·墨索里尼的头脑中， 并在战后得到完善，最终成为意大利的指导思想。这种思想具有高度的极权主义和激进性，意图通过军事和外交手段，将意大利文化重塑成前所未有的事物，开启新的文艺复兴并将意大利带回其辉煌。 \n\n圣墓主义不会成为历史留下的无名之辈。由于其高度的适应性，它可能成为世界各地社会主义主要学派之一。由于索雷尔主义和莫斯利主义等意识形态的普及，以及民族布尔什维克主义思想在俄罗斯的兴起，我们可以看到对民族社会主义思想的高需\n\n新的圣墓主义学派，也被称为“新圣墓主义”，与其最初的形式有所不同。它非常兼容其他意识形态的混合，贝尼托·墨索里尼的思想已经演变成许多方向。农业倾向与西西里法西斯主义的元素已经突显出来，但也有新的教义，类似于布哈林主义或莫斯利主义。圣墓主义的演化是必然的，我们现在可以看到它的奇妙之处"
 tot_euro_mosleyism:0 "奥斯瓦尔德·莫斯利思想"
 tot_euro_mosleyism_desc:0 "£KR_game_rule_flag_ENG_Mosley_Federation §V奥斯瓦尔德·莫斯利思想§!\n\n£GFX_ideology_mosley_thought_bar\n\n\n\n\n莫斯利思想是不列颠准则主义在“准则革命”胜利后的制度化实践与极端发展形态。其核心表现为对领袖奥斯瓦尔德·莫斯利的系统性神格化与绝对威权体制的建立。莫斯利被拥立为“大护国公”，正式承袭奥利弗·克伦威尔的历史法统，同时以“革命卫士”身份自居，宣称终结了“红色贵族专制”的腐败秩序。通过《统一权力法案》，莫斯利兼任国家元首、武装力量总司令及准则党终身主席，形成以个人意志为最高律令的独裁架构。\n在表面上实践国家工团主义经济理念，承诺消除阶级对立，保障宗教宽容、跨种族民族认同及性别平等，实际通过准则派控制的秘密警察严密监控公民组织，逐步抹杀了极权主义的革命色彩。而在对外政策上，准则派狂热地追求复现甚至超越旧大英帝国的荣耀，以“盎格鲁-撒克逊文化统合”为名，推动与前大英帝国殖民地构建依附性同盟；以“泛欧兄弟团结”为旗，谋求与欧洲同质文化国家建立等级化政治联盟。\n所以，尽管莫斯利及其追随者自诩该思想为社会主义革命的终极胜利，其践行的领袖崇拜、党国独裁、文化沙文主义与经济控制模式，被国际社会主义阵营广泛批判为“戴着进步面具的新帝国主义”。"
 radsoc_united_front:0 "统一阵线"
 radsoc_united_front_desc:0 "§Y统一阵线§!\n\n£GFX_ideology_united_front_bar\n\n\n\n\n统一阵线是左翼政治实践中的一项核心战略，指在特定历史条件下（如对抗强大的反动政权、右翼极端主义威胁、殖民统治或军事独裁），具有不同意识形态光谱的政党、组织或社会力量（涵盖社会主义、共产主义、进步自由主义乃至民族主义等），基于共同面临的核心威胁或亟需实现的阶段性目标（如民族解放、争取民主权利或抵抗外敌），暂时搁置内部差异形成的广泛政治联盟。\n其根本逻辑在于通过力量聚合弥补单一力量的不足，形成对抗共同敌人的强大合力，这要求参与的各方（尤其是革命先锋力量）在坚持自身政治独立性和最终目标的前提下，在行动纲领和策略上做出策略性妥协，专注于各方都能接受的共同最低纲领。\n经典理论认为统一阵线是过渡性策略，旨在创造条件为更彻底的变革铺路，预期在共同威胁解除或目标达成后自然解体。但在特定情境下，成功的统一阵线可能超越临时性，演变为长期的政治合作模式。"
 tot_united_front:0 "统一阵线"
