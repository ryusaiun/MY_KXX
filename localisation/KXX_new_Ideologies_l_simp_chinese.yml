 radsoc_social_anarchism:0 "社会无政府主义"
 radsoc_social_anarchism_desc:0 "§Y社会无政府主义§!\n\n社会无政府主义，也称为左翼无政府主义或社会主义无政府主义，是无政府主义的一个分支，它认为自由和社会平等是相互关联的。它主张进行社会革命，以消除压迫性的等级制度，例如资本主义和国家。取而代之的是，社会无政府主义者通过互助鼓励社会合作，并设想非等级形式的社会组织，例如志愿者协会。社会无政府主义与皮埃尔·约瑟夫·蒲鲁东、米哈伊尔·巴枯宁和彼得·克鲁泡特金的社会主义传统一致，也经常被拿来与对社会主义持批评态度个人无政府主义进行对比。"
 anarcho_market_socialism:0 "无政府市场社会主义"
 anarcho_market_socialism_desc:0 "§Y无政府市场社会主义§!\n\n不同于市面上的多数主张实行激进的社会革命、主张废除生产资料私有制的无政府主义流派，无政府市场社会主义者主张实现温和较为温和的社会所有制转化，即保留一定程度的私有制。\n\n实际上无政府主义从一开始就没有要求实现公有制。现代无政府主义的开创者蒲鲁东在著作中表示无政府主义社会应是一种建立在生产者的小私有制上的，基于自愿原则与互助原则的社会。\n\n虽然巴黎公社的失败宣布了无政府主义最原初的样式的失败，但仍然有许多人相信这一思想，这些乐观的勇士不屑于与土匪和盗贼为伍，独自行走在通往和平美好的乌托邦的长路上。"
 military_anarchism:0 "军事无政府主义"
 military_anarchism_desc:0 "§Y军事无政府主义§!\n\n军事无政府主义是无政府主义在实践中演化出的一个分支。虽然无政府主义者主张废除权威、摧毁国家暴力机器，但在实践中，无政府主义者却往往不得不和他们最厌恶的力量——军队合作。随着革命形式的变化，这种合作还会不断加深，最终转变为一种奇异的社会形式：所谓的无政府主义者掌控着一个庞大的等级森严的军队，用最暴力最极权的手段捍卫公社的独立与自由。\n\n归根结底，军事无政府主义社会只是一个通往真正自由的无政府主义社会的一个过渡状态，但也不乏野心家以此借口攫取财富与权力。"
 individualist_anarchism:0 "无政府个人主义"
 individualist_anarchism_desc:0 "§Y无政府个人主义§!\n\n无政府个人主义是一种反抗集体主义的哲学思想，以及特别强调个人地位和个人自治权的无政府主义流派。无政府个人主义主要是在美国发展，他们最显著的特色是拥护对劳动产品的私人所有权。\n\n无政府个人主义的发展也结合了一些欧洲的思想家的理论，包括了威廉·戈德温、皮埃尔-约瑟夫·普鲁东、王尔德、麦克斯·施蒂纳等人，不过无政府个人主义的大部分理论主要还是源自于美国的思想家如莱桑德·斯波纳、约书亚·沃伦 、本杰明·塔克、以斯拉·海伍德、史蒂芬·皮尔·安德鲁斯和亨利·戴维·梭罗等人的影响。无政府个人主义有时也被视为是古典自由主义的分支，因此也被一些人称为“自由无政府主义”\n\n不同的无政府个人主义者之间也存在相当大的差距。几乎在皮埃尔-约瑟夫·普鲁东之后的所有无政府个人主义者都会支持某种形式的私人财产所有权，称之为“占有”。麦克斯·施蒂纳支持私人财产，但却否认财产权利的概念。威廉·戈德温属于利他主义者。约书亚·沃伦提倡以自然法作为个人自由的基准，而本杰明·塔克则将其作为利己主义的根基。塔克反对智慧财产权，但莱桑德·斯波纳则拥护之。无论如何，所有这些哲学家的共同特色是反对集体主义的社会概念，同时也反对资本主义的经济制度，并提倡个人的自主性。"
 revolution_falangism:0 "革命长枪主义"
 revolution_falangism_desc:0 "§Y革命长枪主义§!\n\n革命长枪主义是长枪主义更加革命的变种，也是由西班牙长枪党的领袖何塞·安东尼奥·德里维拉所开创，在经过了资本家的肆虐之后，革命长枪主义彻底放弃了与资本家合作，转而同社会底层阶级坚定的站在一起。革命长枪主义很大程度的向新式国家工团主义靠拢，在革命长枪主义与领袖的铁腕领导下，神职人员、工人、农民将会一同建设新祖国，朝向天主口中真正的理想天国大步迈进，途中的一切阻挡之物通通会被砸碎。"
 autdem_falangism:0 "长枪主义"
 autdem_falangism_desc:0 "§Y长枪主义§!\n\n长枪主义又称西班牙天主教主义，由西班牙长枪党的领袖何塞·安东尼奥·德里维拉所开创，结合了部分国家工团主义和西班牙至上主义，长枪主义要求党员对领袖绝对忠诚、各阶级积极合作共造圣经之中的天国，并且宣扬教会的地位至高无上。他们对于君主制问题摇摆不定，有些信徒宣传只有国王才能引领国家走向复兴，而另外一些信徒则宣传只有一位铁腕强人才能够统领全国"
 falangism:0 "长枪主义"
 falangism_desc:0 "§Y长枪主义§!\n\n长枪主义又称西班牙天主教主义，由西班牙长枪党的领袖何塞·安东尼奥·德里维拉所开创，结合了部分国家工团主义和西班牙至上主义，长枪主义要求党员对领袖绝对忠诚、各阶级积极合作共造圣经之中的天国，并且宣扬教会的地位至高无上。他们对于君主制问题摇摆不定，有些信徒宣传只有国王才能引领国家走向复兴，而另外一些信徒则宣传只有一位铁腕强人才能够统领全国"
 pau_falangism:0 "长枪主义"
 pau_falangism_desc:0 "§Y长枪主义§!\n\n长枪主义又称西班牙天主教主义，由西班牙长枪党的领袖何塞·安东尼奥·德里维拉所开创，结合了部分国家工团主义和西班牙至上主义，长枪主义要求党员对领袖绝对忠诚、各阶级积极合作共造圣经之中的天国，并且宣扬教会的地位至高无上。他们对于君主制问题摇摆不定，有些信徒宣传只有国王才能引领国家走向复兴，而另外一些信徒则宣传只有一位铁腕强人才能够统领全国"
 spanish_syndicalism:0 "国家工团主义（西）"
 spanish_syndicalism_desc:0 "§Y国家工团主义（西）§!\n\n在国家工团主义进攻委员会在西班牙社会斗争的数年来，拉米罗·莱德斯马·拉莫斯总结出了一套超越旧“法团主义”和马克思主义的新理论：民族工团主义。其理论融合了革命工团主义、民族主义、国家至上理念，在广大狂热而迷茫的青年中获得了很大的支持。\n与意大利的国家工团主义不同，民族工团主义并不把治理国家的希望放在一小撮精英身上，“国家是由英勇的人民所创造，而非精英创造的”，因此其很大程度的反对技术官僚或革命官僚统治，领袖应该由最忠诚、英勇、果敢的人来担任。对于经验主义，他们更是嗤之以鼻，“行将就木的枯骨嘶哑的大喊，用腐烂萎缩的拳头拒绝青年的活力，革命必须保持最纯洁的状态，年长者们必须向青年让步。”\n在经济方面，民族工团主义支持一种类似于国家资本主义的制度，工人监督队将会监管企业的生产，企业的利润则将会分配给工人。除此之外，更加激进的民族工团主义者则对计划经济抱有很大的期望。\n民族工团主义者对阶级斗争的态度更加模棱两可，他们否定马克思主义将阶级置于国家之上，这对整个民族而言是一种背叛，“在新社会到来之前，商人、工人、农民必须团结在一起，摧毁资产阶级政权”民族国家的威胁在被彻底消灭之前，士农工商不可出现分歧，在此期间国家将协调各方矛盾。而威胁解除之后，一个民族工人国家将会被建立起来，国家将确保本民族工人的利益至高无上。\n民族工团主义的反对者抨击其为马克思主义的幽灵、癫狂的极端主义分子，而JONS的战士们毫不在乎，在民族工人国家建立之前，所有的蛀虫和民族叛徒将被一一清算，祖国将会从敌人的鲜血与尸骸中崛起并焕发出新的生机。"
 radsoc_bonapartism_subtype:0 "波拿巴主义"
 radsoc_bonapartism_subtype_desc:0 "§Y波拿巴主义§!\n\n波拿巴主义是一种直接受到法国皇帝拿破仑一世及其继任者的政策启发而形成的意识形态。这种意识形态支持由一位领袖拥有强大的行政权力，无论是以共和制还是君主制的形式，但与传统独裁不同的是，这位统治者与其臣民之间会建立直接、民主和个人的联系，通常采取组织投票和公投的形式。同时波拿巴主义政权也重视国家军备的建设。波拿巴主义者往往是民粹主义者，又鼓吹精英统治，将其视为正确的政府组织形式。这一意识形态虽然在20世纪衰落，但仍被几个不同的法国政治运动所主张，其中大多数运动呼吁让波拿巴家族回归王位。尽管颇为罕见，但一些非法国人也会声称自己是波拿巴主义者，比如危地马拉的乌维科将军。"
 pan_celticism_subtype:0 "泛凯尔特主义"
 pan_celticism_subtype_desc:0 "§G泛凯尔特主义§!\n\n泛凯尔特主义是一种横跨意识形态光谱的意识形态，从马克思主义者和各种左翼人士到保守主义者、军国主义者和自由派，其诉求与目标也很简单，那就是主张将苏格兰，威尔士，爱尔兰，布列塔尼，加利西亚等凯尔特人聚居区统一在一面旗帜之下，然而，不同的组织有不同的主张与做法，因此，各种泛凯尔特主义的经济和政治意识形态以及他们统一的计划都有很大不同。"
 tot_pan_celticism_subtype:0 "泛凯尔特主义"
 tot_pan_celticism_subtype_desc:0 "§G泛凯尔特主义§!\n\n泛凯尔特主义是一种横跨意识形态光谱的意识形态，从马克思主义者和各种左翼人士到保守主义者、军国主义者和自由派，其诉求与目标也很简单，那就是主张将苏格兰，威尔士，爱尔兰，布列塔尼，加利西亚等凯尔特人聚居区统一在一面旗帜之下，然而，不同的组织有不同的主张与做法，因此，各种泛凯尔特主义的经济和政治意识形态以及他们统一的计划都有很大不同。"
 national_collectivist_subtype:0 "国家集体主义"
 national_collectivist_subtype_desc:0 "§Y国家集体主义§!\n\n国家集体主义是皮埃尔·克莱门蒂和他的国家集体党的官方意识形态，国家集体主义是反犹太主义、反共济会、反资本主义的和反无政府主义的，支持泛欧民族主义和拉塔奇主义，主张“法国血统”的种族至上主义。"
 hervism_subtype:0 "爱尔威主义"
 hervism_subtype_desc:0 "§Y爱尔威主义§!\n\n£GFX_ideology_herveism_bar\n\n\n\n\n所谓的爱尔威主义，不过是一个用以描绘法国政治家古斯塔夫·爱尔威思想的专有名词。作为共和国政坛和社会主义的老将，他的行事浪漫且不拘一格，善用耸人听闻和挑衅性的运动来达成自己的目的，这让他成为了持有最混乱意识形态的“主流力量”。\n爱尔威主义混合了和平主义，军国主义，民族社会主义，布朗热主义，主张以军国主义打倒军国主义从而维护和平，反对资本主义带来的自由主义政治，支持一个如同布朗热一样的强人实施革命的独裁统治。此外，爱尔威主义还主张欧洲各民族平等结成联盟，从而实现欧洲的永远和平。但与法国的其他民族主义运动的反犹主义立场不同，爱尔威主义竭力维护犹太人的利益，认为他们是光荣的法国公民。"
 socdem_possibilism_subtype:0 "可能主义"
 socdem_possibilism_subtype_desc:0 "§Y可能主义§!\n\n可能主义，也被称为布鲁斯派，是保罗·布鲁斯领导的法国社会主义运动的一个派别。贝努瓦·马隆和其他人支持该派系，尽管他们并不总是完全分享其鼓舞人心的原则。它起源于“法国社会主义工人党联合会” 该派主张不经过革命,而通过可能的、逐步的改良来变革社会。要求修改法国工人党党纲，取消其中关于实现社会主义和共产主义的内容。认为工人党不要局限于一种学说的狭隘眼界，而应为各种学说的拥护者敞开大门。反对统一的中央权力,强调党的地方自治原则。主张运用普选权，争取议席，实行市政社会主义。提倡由国家干预，使垄断资本转变为社会所有的公用事业。"
 radsoc_possibilism_subtype:0 "可能主义"
 radsoc_possibilism_subtype_desc:0 "§Y可能主义§!\n\n可能主义，也被称为布鲁斯派，是保罗·布鲁斯领导的法国社会主义运动的一个派别。贝努瓦·马隆和其他人支持该派系，尽管他们并不总是完全分享其鼓舞人心的原则。它起源于“法国社会主义工人党联合会” 该派主张不经过革命,而通过可能的、逐步的改良来变革社会。要求修改法国工人党党纲，取消其中关于实现社会主义和共产主义的内容。认为工人党不要局限于一种学说的狭隘眼界，而应为各种学说的拥护者敞开大门。反对统一的中央权力,强调党的地方自治原则。主张运用普选权，争取议席，实行市政社会主义。提倡由国家干预，使垄断资本转变为社会所有的公用事业。"
 radsoc_saint_simonianism_subtype:0 "圣西门主义"
 radsoc_saint_simonianism_subtype_desc:0 "§Y圣西门主义§!\n\n£GFX_ideology_saint_simonianism_bar\n\n\n\n\n圣西门主义是19世纪初由法国思想家亨利·德·圣西门提出的社会改革理论，被视为空想社会主义的重要流派。其核心主张以科学、工业和社会组织为基础，批判封建社会与资本主义的剥削，认为社会应由科学家、工程师和实业家等“生产者阶级”主导，取代贵族、教士等“寄生阶级”，通过合理规划实现技术进步与全民福祉。\n圣西门提出，工业化是推动社会进步的关键，主张建立以“按能力分配，按劳取酬”为原则的协作型社会组织，消除贫富分化。他强调社会团结与道德责任，后期思想甚至带有宗教色彩，主张以“新基督教”精神实现人类共同体。其追随者进一步提出废除私有制、建立国家计划经济等激进主张，但反对暴力革命，倡导通过和平改革过渡到理想社会。\n尽管圣西门主义因脱离无产阶级现实、缺乏实践路径而被视为“空想”，但其对阶级分析、生产组织和社会平等的探索深刻影响了马克思主义及后来的社会主义思潮，成为现代工业社会批判与乌托邦构想的重要思想源头。"
 polish_natsynd:0 "蓝色工团主义"
 polish_natsynd_desc:0 "§Y蓝色工团主义§!\n\n波兰工团主义运动一直是各种倾向和思想的大熔炉。虽然你可能会了解到一些类似于巴黎或伦敦的理论，但当你了解工团主义的“民族一面时，你可能会感到敬畏或恐惧。\n氧化工团主义、蓝色工团主义或克拉科夫工团主义学派，是由卡齐米日·扎克耶夫斯基领导的去波兰工团主义者联盟成员创立的一种学说。这一学说既确立了波兰民族主义理念，又希望按照分权路线将中欧统一为一个革命的社会主义国家，将社会主义同反动派斗争的思想推向极致。该运动因使用蓝色而非红色而在激进左派中声名鹊起他们声称旧的社会主义理论已经“黔驴技穷"，而这新流派则为革命注入了新鲜血液。蓝色工团运动的血液充满活力、激进，在扎克耶夫斯基实现统一中欧的梦想之前不会停止。"
 mantetsu_system_subtype:0 "满铁体制"
 mantetsu_system_subtype_desc:0 "§Y满铁体制§!\n\n"
 nihonyudaya_shugi_subtype:0 "日犹主义"
 nihonyudaya_shugi_subtype_desc:0 "§Y日犹主义§!\n\n所谓“日犹主义”是日本加尔文宗牧师酒井胜军对明治时期“日犹同祖论”思想的进一步发展。他认为，犹太人之所以能够征服世界、在各国内部搞破坏,显然都是遵从神的旨意,虽然日本也将会是犹太人搞破坏的对象，但是由于日本是神国,国民没有忘记敬神尊皇之心,所以犹太人是无法征服日本的。在犹太人毁灭其他国家,却唯独毁灭不了日本后,他们就会发现，原来日本才是他们长期以来追求的神之帝国,日本天皇本人才是弥赛亚本人。"
 syn_volkisch_communitarianism_subtype:0 "人民社群主义"
 syn_volkisch_communitarianism_subtype_desc:0 "§Y人民社群主义§!\n\n人民社群主义是奥地利德意志工人党的官方意识形态。人民社群主义也被党通俗地称为“民族社会主义”，这种思想以带有社会主义色彩的人民主义为引导，通过工人与全社会实现日耳曼复兴。人民社群主义的支持者深深地怀念德意志帝国，关切海外的德意志人，他们鄙视民主制度，支持陶尔斐斯式的两院制法团模式。人民社群主义与奥地利极右翼紧密相连，通常可划分为两大派系：一派是沃尔特·里尔及其副手约瑟夫·利奥波德的极权派，另一派则是弗劳恩费尔德的民粹派，以及埃德蒙·格莱兹-霍斯泰瑙的保皇派边缘团体。\n\n奥地利德意志工人党以及各路人民社群主义支持者都亲善工会，并从工会的实干和教训中汲取了方法手段和理念激情。不过，他们也视无产阶级为伟大且富有教养的工人阶级的肿瘤。大体上讲，极权派忠于意识形态的核心教条，而民粹派则更加激进化，更着重于德意志人民。"
 ultranationalism_proto_subtype:0 "极端民族主义"
 ultranationalism_proto_subtype_desc:0 "§Y极端民族主义§!\n\n极端民族主义是民族主义的一种极端形式，指一个国家主张或维持有害的霸权，或对其他国家的其他形式的控制（通常通过暴力胁迫）以追求其特定利益。\n从意识形态的角度来看，极端民族主义源于将现代民族国家视为与自然人直接相似的活有机体，因为它们可以腐烂、生长和死亡，甚至重生。政治家们以赤裸裸、神话般的方式将社会分为堕落劣等和具有伟大使命两种，通过使用所谓国家复兴的计划来操纵民智。"
 left_occultism_subtype:0 "革命神秘主义"
 left_occultism_subtype_desc:0 "§V革命神秘主义§!\n\n£GFX_ideology_left_occultism_bar\n\n\n\n\n当多数现代人把弗里吉亚帽视作自由与共和的象征时，另外一部分人则选择凝视它的过去。革命神秘主义者们坚信人类精神体验的特殊性，灵性与民主哲学总是交织的。法国大革命的民主理想被认为植根于密特拉教的神秘，头戴弗里基亚帽的玛丽安娜以一种秘仪的形式给人类带来了自由精神。\n这种奇特的意识形态在革命知识分子中并不少见，虽然现代革命常常抵制神秘主义的加入，但是解放全人类的思想自古以来便存在。为突破工具理性对解放叙事的祛魅，激进知识分子不断重构着具有弥赛亚特征的革命神话学。他们或是拥抱古老的民俗，提取先民的经验；或是选择前卫的探索，一究未知的领域。虽然手段诡异，但最终都指向解放本民族或是全体人类的远大理想。\n从密特拉教的地下圣所到巴黎街垒，人类解放话语始终保持着灵知主义的基因隐线，边缘化的思想者们会永远续写自由精神的启示录诗学……"
 radsoc_left_occultism_subtype:0 "革命神秘主义"
