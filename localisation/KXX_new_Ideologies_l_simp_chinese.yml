 provisional_government_subtype:0 "临时政府"
 provisional_government_subtype_desc:0 "§Y临时政府§!\n\n冲突的结束井不意味着战争的彻底终结。战争留下的疮痍仍然存在，国家再度陷人混乱或政权崩溃的风险仍然威胁着人民。在废墟中，人们建立了临时政府来完成过渡性的使命。\n在长久的混乱时期后，临时政府致力于重建社会秩序与法治。无休止的战争、革命浪潮裹挟而来的血雨腥风，前一个时代遗留下的准无政府状态被临时政府一扫而空，其治下相对安稳的局面为身心俱疲的民众带去慰藉，令人民欢呼雀跃。昔日冲突尽数被人们摒弃，全国范围内的政治对话重新展开，以便临时政府为紧随其后的常任政府制定新的法律架构。临时政府在国家重建方面做了很多工作：重振长久以来被弃置不顾、被腐败蛙蚀的政府机构，重新阐释法律；评估国家遭受的创伤，并以政治和经济为抓手制定重建方案，通过切实可行的手段处理旧政权留下的烂摊子。他们希望能够依靠自身努力让从根本上被动摇的国家实现全面意义上的重回正轨，让人民摆脱余悸。"
 transitional_government_subtype:0 "看守政府"
 transitional_government_subtype_desc:0 "§Y看守政府§!\n\n又称过渡政府、临时政府或临时内阁，从根本上来说是一种临时的特设政权，存在于更为正式的新政府（无论通过民主选举、军事政变或其他方式产生）组建或就职之前，常见于议会制国家，其成员通常由随机挑选的国会议员或即将离任的国会议员组成。其主要职责是履行有限的政府职能，维持国家机构的日常运转和国家现状。看守政府通常在前任政府倒台（或任期结束）后迅速成立，但无论其前任倒台的原因如何，其固有的合法性普遍较低。因此，如果它们不被尽快取代，容易引发国内的混乱和动荡。\n这类政府即使是非政治性的，也往往带有相对威权的色彩，以确保政权过渡期间的基本稳定。同时，它们通常缺乏政治意愿和实质能力去执行任何有切实意义的重大政策或立法，因为其缺乏进行此类行动的合法授权（尤其是选举赋予的权力）。从实质上讲，在正式政府替代看守政府之前，国家治理往往处于一种“冻结”状态。"


 generic_sssp_subtype:0 "科学特搜署"
 generic_sssp_subtype_desc:0 "§R第三国际科学特搜署§!\n\n£GFX_ideology_SSSP_bar\n\n\n\n\n第三国际科学特搜署为第三国际最高执行委员会直属之常设科学协调与行动机构。本署由法兰西公社联邦、意大利社会主义共和国及不列颠联盟依据《雷恩协定》联合倡议并主导设立，常驻总部位于海峡群岛特别管辖区。\n\n本署的核心职能在于调查、研究与管控全球范围内的超自然或异常事件与现象；开展涵盖前沿科学、神秘学及民俗学的多学科交叉研究，拓展人类知识疆界；系统观察、分析全球民俗传说与历史记录中的超常要素，评估其风险与研究价值；向第三国际及成员国提供科学评估、风险预警及应对策略；并在国际框架内协调相关资源与行动。\n\n本署运作遵循以下核心原则：始终以科学理性与实证精神为根基，同时保持对未知的开放；人类福祉与安全为最高行动准则；秉承国际主义与协作精神，超越国界服务全人类共同利益；严格管控敏感信息，防止社会恐慌与敌对利用，同时支持安全前提下的学术交流；恪守最高伦理标准与责任感。"
