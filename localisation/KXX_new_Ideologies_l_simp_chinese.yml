 tot_maurrasism_subtype:0 "革命整合民族主义"
 tot_maurrasism_subtype_desc:0 "§Y革命整合民族主义§!\n\n尽管蒲鲁东圈分裂后，仍然有一小撮人视图弥合他的分裂。莫拉斯的酒神精神和索雷尔的日神精神影响着新一代法兰西人。"
 faisceau_subtype:0 "费索主义"
 faisceau_subtype_desc:0 "§Y费索主义§!\n\n费索主义是索雷尔主义的右翼化版本。"
 doroism_subtype:0 "DORO主义"
 doroism_subtype_desc:0 "§YDORO主义§!\n\n£GFX_ideology_doroism_bar\n\n\n\n\nDORO主义是一种互联网迷因的延续。你或许见过这个看上去就非常睿智，长着蜡笔小新脸的小女孩，就算你不知道她名字叫什么，她出自哪里，她的脸你也一定眼熟。虽然这张脸可以被P到任何表情包上，但是初始版本是搭配四爪着地的身子，所以又被一些不认识的人称呼为“粉狗”。这只“小粉狗”的名字叫做“DORO”，她的原型是来自韩国游戏《NIKKE：胜利女神》中的角色桃乐丝（Dorothy）。与美丽、智慧而悲惨的本体相比，DORO因其睿智而魔性的外表得到了全球网友的青睐，一时间成为风靡整个互联网的迷因。\n现在本居小铃在KXX的世界里面引入了这一迷因，DORO们将会不断地同化游戏中这些肮脏而好斗的政客，在全球建立起一个全部属于DORO的DORO国度。"
 bangdreamism_subtype:0 "梦想协奏曲主义"
 bangdreamism_subtype_desc:0 "§Y梦想协奏曲主义§!\n\n£GFX_ideology_bangdreamism_bar\n\n\n\n\n作为乐队的吉他和主唱，户山香澄一直在寻找着，如同小时候仰望星空时听到的“星之律动”一样的，闪闪发光而令人心动的事物。由此才促成了"Poppin'Party"的组建。在这个少女乐队时代中闪闪发光的女子高中生5人乐队组合，将自己的心情寄托于音乐当中，为了将更多让人心动不已的事情传递出去而每日歌唱。\n\n乐队十年苦来兮，现在的户山香澄已经被奉为“邦高祖”，她所提出的一系列思想，都被实践所证明是少女乐队的真正诗学。香澄指出，乐队大邦邦的首要原则是:§9“闪闪发光,心跳不已”§!。某乐队大搞大吹所谓“黑暗风”、“阴郁风”乐队成员不积极承认矛盾,让整个乐队生态陷入恶性循环,最终必然导致恶果。\n\n§9邦多利目的是让人欣赏kirakiradokidoki的少女乐队，如果少女乐队导致两极分化,企划就失败了!如果产生什么新的暗黑风少女剧团,那我们就真是走了邪路了!§!"
 genshitism_subtype:0 "原神主义"
 genshitism_subtype_desc:0 "§Y原神主义§!\n\n£GFX_ideology_genshitism_bar\n\n\n\n\n所谓“中国现代诺斯替宗教”即中国游戏《原神》中早期提倡的一种设计理念，即模仿日本动漫"Fate"系列使用诺斯替主义思想来表现游戏的世界观念。诺斯替主义又叫“灵知派”，“诺斯替”一词在希腊语中意为“知识”，也是游戏标题中“原”的词根。诺斯替的教义将通过个人经历所获得的知识或意识称为“灵知”（或“真知”），他们相信“灵知”可使他们脱离无知及现世。是一种企图中和物质和精神的二元论的世界观。\n\n你说的对，但是《原神》是由米哈游自主研发的一款全新开放世界冒险游戏。游戏发生在一个被称作「提瓦特」的幻想世界，在这里，被神选中的人将被授予「神之眼」，导引元素之力。你将扮演一位名为「旅行者」的神秘角色在自由的旅行中邂逅性格各异、能力独特的同伴们，和他们一起击败强敌，找回失散的亲人——同时，逐步发掘「原神」的真相。\n\n§C哒哒哒哒哒~好想玩原神~云原神~当当当当当~看精彩纷纷~§!\n\n§V珍爱生命，远离原神。§!"
 radsoc_datong_shu_subtype:0 "大同书思想"
 radsoc_datong_shu_subtype_desc:0 "§Y大同书思想§!\n\n£GFX_ideology_datong_shu_thought_bar\n\n\n\n\n中国维新变法的倡导者康有为在《大同书》中描绘了其终极理想——大同世界。其核心思想旨在彻底破除导致人类苦难的“九界”（国界、级界、种界、形界、家界、业界、乱界、类界、苦界），认为家庭和私有制是万恶之源，主张取消家庭关系（废除婚姻契约，代之以一年期可续约的情侣关系）、废除私有财产，实现彻底的公有制。\n他设计了一个高度组织化的全球治理体系，由民选的“公政府”统一管理世界事务，实施计划经济，利用科技高度发展物质生产，实现财富按需分配，为人民提供各种福利保障。他强调平等，主张消除国家、种族、性别等一切界限（但未提及消灭阶级，且成年男女必须参军），人人自由、平等、互助，最终实现天下为公、世界大同。\n虽然康有为的思想深受西方资产阶级民主和空想社会主义的影响，但其根植于儒家“仁”的理想和公羊学派“三世说”进化史观，所以《大同书》的支持者更多的是支持改造传统文化、推崇儒家的民族主义者。\n《大同书》对和谐、均等、自足、无压迫社会的追求无疑契合了东亚农业文明中源远流长的“桃花源”式社会理想，正因这种深层文化共鸣，康有为的思想在苦于现代工业文明弊病的日本农本主义知识分子和践行者中也备受追捧。"
