 anarcho_individualism_subtype:0 "无政府个人主义"
 anarcho_individualism_subtype_desc:0 "§Y无政府个人主义§!\n\n无政府个人主义是一种反抗集体主义的哲学思想，以及特别强调个人地位和个人自治权的无政府主义流派。无政府个人主义主要是在美国发展，他们最显著的特色是拥护对劳动产品的私人所有权。\n\n无政府个人主义的发展也结合了一些欧洲的思想家的理论，包括了威廉·戈德温、皮埃尔-约瑟夫·普鲁东、王尔德、麦克斯·施蒂纳等人，不过无政府个人主义的大部分理论主要还是源自于美国的思想家如莱桑德·斯波纳、约书亚·沃伦 、本杰明·塔克、以斯拉·海伍德、史蒂芬·皮尔·安德鲁斯和亨利·戴维·梭罗等人的影响。无政府个人主义有时也被视为是古典自由主义的分支，因此也被一些人称为“自由无政府主义”\n\n不同的无政府个人主义者之间也存在相当大的差距。几乎在皮埃尔-约瑟夫·普鲁东之后的所有无政府个人主义者都会支持某种形式的私人财产所有权，称之为“占有”。麦克斯·施蒂纳支持私人财产，但却否认财产权利的概念。威廉·戈德温属于利他主义者。约书亚·沃伦提倡以自然法作为个人自由的基准，而本杰明·塔克则将其作为利己主义的根基。塔克反对智慧财产权，但莱桑德·斯波纳则拥护之。无论如何，所有这些哲学家的共同特色是反对集体主义的社会概念，同时也反对资本主义的经济制度，并提倡个人的自主性。"

 tot_marxist_humanism_subtype:0 "人本主义马克思主义"
 tot_marxist_humanism_subtype_desc:0 "§Y人本主义马克思主义§!\n\n£GFX_ideology_marxist_humanism_bar\n\n\n\n\n又称马克思主义人文主义、马克思主义人道主义，是一种根植于从人文主义角度解释卡尔·马克思著作的世界思想和政治行动。其理论源头可以追溯到本世纪二十年代卢卡奇、科尔施和葛兰西等人对于马克思思想中黑格尔元素的发掘。而1932年《1844年经济学哲学手稿》的首次出版，则直接推动了从人道主义视角系统解读马克思理论的浪潮。手稿被翻译成法文后，迅速引起了法国左翼知识界的强烈共鸣，其中以亲雅各宾派的哲学家让-保罗·萨特和莫里斯·梅洛-庞蒂为代表，从存在主义角度直接推动了人本主义马克思主义的成体系发展。\n人本主义马克思主义从马克思主义哲学的批判性视角出发，对“人的本质是什么以及什么样的社会最有利于人类繁荣”进行探讨。其支持者认为，马克思早期的哲学著作与他发展的异化理论以及他后来作品如《资本论》中所描述的资本主义社会结构之间存在着连续性，必须把握马克思的哲学基础才能正确理解他的后期作品。\n与传统的辩证唯物主义解释相反，马克思主义人文主义者认为马克思的思想是启蒙人文主义的辩证超越。在其他马克思主义哲学流派将马克思主义视为一门自然科学时，马克思主义人文主义重申了“人是万物的尺度”的信条——即人类在本质上与自然秩序的其他部分有着根本区别，并应该在马克思主义理论中得到相应对待。\n该思潮在西欧社会主义圈子中呈现出流行的趋势，甚至部分无政府主义者与工团主义者也参与其中。然而，占据传统马克思主义正统地位的理论家们（如俄国布尔什维克）对此展开激烈批判。他们认为人本主义实质是资产阶级个人主义的理论变体，忽视了马克思思想以1845年为界的认识论分野，更将这种对"异化"概念的持续强调视为需要警惕的理论修正主义。"
 marxist_humanism_subtype:0 "人本主义马克思主义"
 marxist_humanism_subtype_desc:0 "§Y人本主义马克思主义§!\n\n£GFX_ideology_marxist_humanism_bar\n\n\n\n\n又称马克思主义人文主义、马克思主义人道主义，是一种根植于从人文主义角度解释卡尔·马克思著作的世界思想和政治行动。其理论源头可以追溯到本世纪二十年代卢卡奇、科尔施和葛兰西等人对于马克思思想中黑格尔元素的发掘。而1932年《1844年经济学哲学手稿》的首次出版，则直接推动了从人道主义视角系统解读马克思理论的浪潮。手稿被翻译成法文后，迅速引起了法国左翼知识界的强烈共鸣，其中以亲雅各宾派的哲学家让-保罗·萨特和莫里斯·梅洛-庞蒂为代表，从存在主义角度直接推动了人本主义马克思主义的成体系发展。\n人本主义马克思主义从马克思主义哲学的批判性视角出发，对“人的本质是什么以及什么样的社会最有利于人类繁荣”进行探讨。其支持者认为，马克思早期的哲学著作与他发展的异化理论以及他后来作品如《资本论》中所描述的资本主义社会结构之间存在着连续性，必须把握马克思的哲学基础才能正确理解他的后期作品。\n与传统的辩证唯物主义解释相反，马克思主义人文主义者认为马克思的思想是启蒙人文主义的辩证超越。在其他马克思主义哲学流派将马克思主义视为一门自然科学时，马克思主义人文主义重申了“人是万物的尺度”的信条——即人类在本质上与自然秩序的其他部分有着根本区别，并应该在马克思主义理论中得到相应对待。\n该思潮在西欧社会主义圈子中呈现出流行的趋势，甚至部分无政府主义者与工团主义者也参与其中。然而，占据传统马克思主义正统地位的理论家们（如俄国布尔什维克）对此展开激烈批判。他们认为人本主义实质是资产阶级个人主义的理论变体，忽视了马克思思想以1845年为界的认识论分野，更将这种对"异化"概念的持续强调视为需要警惕的理论修正主义。"

 natpop_based_subtype:0 "国家社会主义"
 natpop_based_subtype_desc:0 "§Y国家社会主义§!\n\n或称“民族社会主义”，是国家民粹主义的一种极端形式。其支持者普遍强调国民作为一个基于共同血统、文化、历史或命运的有机统一体，内部的社会矛盾应被国家力量消弭，以服务于民族的整体强盛。在这里，国家则被视为民族意志和集体利益的最高体现，国家利益至高无上，超越个人或阶级利益，民族生存、强大和荣耀是国家行动的根本目标。这种意识形态通常主张建立强大的、中央集权的领导核心（围绕一个拥有超凡魅力的领袖或单一政党），民主程序则被视为低效或对民族统一有害而被弱化或取消。\n国家社会主义者坚定拒绝国际主义、全球化和普世价值，视其为对民族特性和国家主权的侵蚀，强调民族自决力的重要性，追求国家在政治、经济和军事上的高度自主。在具体的经济主张上，国家社会主义者提倡国家主导的混合经济，主张在关键战略产业实行国家所有或国家强力干预与调控，以服务于国家目标，同时允许私有经济在非关键领域存在，但需服从国家统制。\n国家社会主义和军团主义、莫拉斯主义等国家民粹主义形式一样，在文化层面，它大力倡导回归并重新诠释被其奉为圭臬的民族§R古老传统、神话传说与祖传美德§!（如勇武、忠诚、团结、牺牲精神），旨在唤醒民众心中沉睡的“§R黄金时代§!”记忆，塑造一种基于历史荣耀感的高度同质化的民族认同。国家通过教育体系、官方艺术赞助、盛大的公共仪式以及对历史遗迹的再诠释等手段，系统性地推广这种被筛选和理想化的“§R传统文化§!”，并将其塑造为对抗现代社会所谓“腐化”与“外来污染”的精神堡垒。"

 tot_dystopian_subtype:0 "反乌托邦体制"
 tot_dystopian_subtype_desc:0 "§Y反乌托邦体制§!\n\n£GFX_ideology_dystopian_bar\n\n\n\n\n反乌托邦体制是一种以高度理性和效率为名，将整个国家和社会变成一台巨大而冷酷机器的统治形态，权力集中于一个声称掌握着绝对真理与科学规划方法的中央机构或领袖手中。它运用最现代化的工业管理手段、严密的档案系统、高效的无线电广播和电影进行无休止的宣传，以及对公民生活从工作到家庭的彻底监视与控制。个人的自由意志、隐私和传统社群被系统性地消除，个体被视为可替换的零件，存在的唯一价值是服务于国家机器设定的宏大而抽象的目标。表面上为全体公民的福祉服务，实则是一种剥夺人性、消灭异议的精密压迫体系。"

 natpop_dystopian_subtype:0 "反乌托邦体制"
 natpop_dystopian_subtype_desc:0 "§Y反乌托邦体制§!\n\n£GFX_ideology_dystopian_bar\n\n\n\n\n反乌托邦体制是一种以民族、种族或某种‘纯洁’的血统为至高信仰基础，最终走向极端压迫的统治形态，它由一个被神化且拥有绝对权威的领袖或核心集团领导，宣称肩负着复兴‘伟大民族’或净化‘民族共同体’的使命。它利用最先进的无线电广播、新闻审查和大型集会进行狂热的煽动性宣传，同时建立庞大的秘密警察网络和告密系统进行严密监控。它依据极端的社会达尔文主义和伪科学理论（如优生学），系统性歧视、迫害甚至消灭被认定为‘内部敌人’或‘劣等群体’的同胞。个体完全湮没于排外的民族狂热洪流中，自由与思想被压制，生存依赖于对领袖意志的绝对服从和对‘民族’这一抽象概念的无限献祭，恐惧成为维系统治的核心手段。"

 left_leaning_legionarism_subtype:0 "左倾军团主义"
 left_leaning_legionarism_subtype_desc:0 "§Y左倾军团主义§!\n\n£GFX_ideology_left_leaning_legionarism_bar\n\n\n\n\n左倾军团主义代表了更广泛军团主义运动中的一个边缘支流，以罗马尼亚的白鹰队运动为典型代表，并在一些后发达国家流行。\n不同于主流的军团主义，它以矛盾的方式将革命热情与该运动特有的民族神秘主义融合在一起。在思想渊源上，左倾军团主义者通常受到索雷尔主义者和国家工团主义者的启发，在经济层面采用左翼法团主义的架构，展现出对资产阶级（或是封建阶级）的激烈拒斥。\n虽然保留了主流军团主义对古老精神理想的向往，但左倾军团主义中的大多数强调利用工人阶级的力量来实现革命目标——即通过民族复兴来彻底改造社会，这使得其外表显得更为世俗和开明。然而，军团主义深植的民族主义狂热与种族纯洁性诉求，始终是其无法剥离的核心特征。"

 esoteric_marxism_subtype:0 "深奥马克思主义"
 esoteric_marxism_subtype_desc:0 "§Y深奥马克思主义§!\n\n£GFX_ideology_esoteric_marxism_bar\n\n\n\n\n深奥马克思主义是一种通过精神视角诠释马克思主义的意识形态，以德国犹太学者瓦尔特·本雅明的弥赛亚马克思主义为典型代表。它摒弃了卡尔·马克思建立其思想所依赖的唯物论和无神论基础，转而希望将一种神秘的世界观融入马克思主义框架之中。\n该意识形态希望将马克思主义带回到其黑格尔主义的根源，并且批判它认为青年黑格尔学派对黑格尔思想所做的革新，认为辩证唯物主义应通过拥抱精神来涤除其幼稚的唯物论。深奥马克思主义试图深化马克思关于物质与历史的分析：革命进程不仅是物质层面通向工人乌托邦的道路，更是精神层面“绝对者”自我实现的过程。物质主义与理想主义在工人对抗资本主义的斗争中相互交融，在“终极实在”向至善的永恒演进中合而为一，二者本质上是同一进程的两面。\n对于神话学——古典马克思主义思想中被忽视的另一个主要领域，深奥马克思主义借鉴借鉴了索雷尔和葛兰西的思想，认为有必要对革命进行一种超越纯粹物质层面的更深刻理解。通过将工人联结至一个更高的元叙事，一个原型故事，一场彻底的革命才可能实现。生活的方方面面都将融入这个故事，以满足人类对文化、宗教和意义的内在渴望。因此，革命神话需要被视作为宗教叙事而非使用工具，马克思主义不仅是一种政治理论，更是一种在现实中展开的形而上学结构，它必须被看作是“真理”。\n而在阶级意识方面，深奥马克思主义将其视为一种精神方式。它可以被比作一位古代神祇，全体工人绑定于它，对其行使能动性。所有结构，包括资产阶级的结构，都被视为对其从属者施加作用力的精神实体。因此，革命不仅仅是人与人之间的战斗，更是“诸神之战”。这场伟大的战役会被“马克思主义的神话”所讲述，确立无产阶级在宏大历史叙事中的主导地位。"
 natpop_esoteric_marxism_subtype:0 "深奥马克思主义"
