 IRE_breakneck_industrialisation_idea: "快速工业化"
 IRE_breakneck_industrialisation_idea_desc: "爱尔兰政府依靠盟友的援助以及多年来学到的技术，开始了一项宏伟的尝试，寻求让其国家的工业能力达到同时代其他国家的水平。尽管很少有人期望爱尔兰能够与世界强国比肩，但人们希望在该计划结束时，爱尔兰将能够在自己的重量级里所向披靡。"
 IRE_urbanisation_idea: "城市化"
 IRE_urbanisation_idea_desc: "为了鼓励我们的人民从爱尔兰的数不清的小型聚居点移居到城市中来，政府启动了一项大规模城市住房建设计划。尽管这些房屋大多是用廉价简单的材料建造的，但很少有人发自内心地抱怨现在他们相较于之前提高的生活水平。"
 IRE_connolly_legacy_idea: "康诺利的遗产"
 IRE_connolly_legacy_idea_desc: "“如果你明天击退英国军队并在都柏林城堡上升起绿旗，假如你不着手开始组织社会主义共和国，你先前的所有努力都将功亏一篑……”\n\n为了将自己与这一位几乎在爱尔兰社会中受到普遍尊敬的独立斗士联系在一起，先前由詹姆斯·康诺利宣读的这些话已成为爱尔兰社会主义者近乎宗教的信条。在社会主义者与反对派人物的辩论中几乎都会提到康诺利，而沿着这位民族英雄的制定的道路建设社会主义的想法已成为社会主义事业前进的强大动力。"
 IRE_ituc_primacy: "爱尔兰劳联会主导"
 IRE_ituc_primacy_desc: "爱尔兰劳工联合会议因其在爱尔兰劳工运动中发挥的重要作用，在爱尔兰政坛取得了举足轻重的地位。显然，在未来几年里，任何有关于改变国家未来的决策都几乎不能在没有爱尔兰劳联会参与的情况下做出。"
 IRE_church_base_idea: "根深蒂固的教会影响"
 IRE_church_base_idea_desc: "天主教教会在爱尔兰国内有着巨大的影响力，许多学校、医院及其他组织都在其管辖范围内，堂区神父也是爱尔兰农村社区的重要组成部分。对于任何试图推动世俗或左翼议程的政府来说，教会都是他们要面临的棘手问题，如果他们希望继续执政，就必须安抚教会。"
 IRE_church_isp_idea: "社会主义沐浴上帝之光"
 IRE_church_isp_idea_desc: "虽然许多社会主义运动拒绝宗教训导，将其视为“大众的鸦片”，但爱尔兰的工团主义运动却试图将天主教训导与其社会主义原则进行融合，并特别强调基督教的慈善与同情的理念。"
 IRE_meitheal: "“邻里互助”"
 IRE_meitheal_desc: "受本国劳工合作运动的历史遗产影响，爱尔兰政府决定起草一份以合作农业为中心、照顾到所有相关方的土改草案。"
 IRE_church_plp_idea: "《爱尔兰政教条约》"
 IRE_church_plp_idea_desc: "尽管天主教会对社会主义统治下的未来有所顾虑，但新政府制定的协议仍让他们得以在爱尔兰文化方面保持重要影响，不过在政治方面就几乎没有直接的掌控或影响了。即便爱尔兰社会中有些激进分子可能不认同现状，但教会本身和统治者对这种安排基本上感到满意。"
 IRE_plp_final_idea: "爱尔兰的红色前途"
 IRE_plp_final_idea_desc: "爱尔兰革命与世界其他地方发生的社会主义大革命不同，既没有旧秩序的全面瓦解，也没有冲垮整个社会的革命浪潮。与之相反，爱尔兰革命是一种朝向社会主义远景的过渡，更为渐进但仍不失革命性。\n\n这种方式遭到了激进分子的批评，不过爱尔兰政府已经明确表示，对他们来说，爱尔兰的前途会坚持社会主义不动摇，要让国家走向社会主义，只需要稳健的大手来引导，而不需要铁拳。"
 IRE_slaves_of_slaves_idea: "解放“奴隶的奴隶”"
 IRE_slaves_of_slaves_idea_desc: "爱尔兰政府发起了一项提拔妇女担任全国性职务的运动，以期兑现其公开宣称的男女平等的承诺。但愿让妇女同志们担任这些具有影响力的职务可以产生一系列连锁反应，最终广泛地改变爱尔兰社会对她们和她们能力的认识。
 IRE_workplace_democracy_idea: "工作场所民主"
 IRE_workplace_democracy_idea_desc: "爱尔兰工人寻求废除与其工作场所相联系的不公正等级制度，已然能够在一些最重要的工作场所决策中实践民主。尽管目前为止这些行动确实提高了生产力与工人幸福度，但工人们一些更具争议的决策引发的僵持迅速招来了接踵而至的批评。"
 IRE_defence_idea: "保卫翡翠之岛"
 IRE_defence_idea_desc: "历经英国七百年之久的统治，爱尔兰人民终于争得了独立。然而，如果不堪设想之事成真，爱尔兰遭到进攻，爱尔兰人民将以捍卫自由的决心与对家乡地形如鱼得水的掌握，准备好击退一切来犯之敌。"
 IRE_irish_social_credit: "爱尔兰的社会信用思想"
 IRE_irish_social_credit_desc: "托蒙德的政变不但彻底令爱尔兰独立先驱蒙羞，更令国家陷入一片混乱中。有鉴于此，著名的爱尔兰独立活动家莫德·贡娜联合反对派推翻了疯王，并计划在爱尔兰实践C.H.道格拉斯的思想。"
 IRE_restore_republicanism: "复兴共和主义"
 IRE_restore_republicanism_desc: "德·瓦莱拉是一个无耻的家伙。他做出的复辟君主制的决定无异于否定了无数爱尔兰独立活动家的的努力。有必要立刻展开宣传，恢复公众对共和国的信心。"
 IRE_ally_RWP: "与革命工人党合作"
 IRE_ally_RWP_desc: "社会信用与共产主义一直有着十分密切的关系，爱尔兰社会信用党的总部甚至因此遭到过极右翼暴徒的袭击，现在是时候正式化这段友谊了。"
 IRE_ally_lp: "拉拢工党"
 IRE_ally_lp_desc: "我们的首席理论家丹尼斯·爱尔兰与工党有着千丝万缕的联系。或许我们可以利用他的影响力合并工党，争取更多盟友。"
 IRE_catholicism: "尊奉天主教会"
 IRE_catholicism_desc: "天主教会一直在积极反对我们。我们应当和他们建立稳妥的关系。"
 IRE_total_eco_reform: "全面经济改革"
 IRE_total_eco_reform_desc: "旧的陈腐经济系统严重束缚了生产力，我们将按照C.H.道格拉斯的思想开始改革经济。"
 IRE_destroy_bankers: "摧毁银行家"
 IRE_destroy_bankers_desc: "银行家是一群寄生虫，他们饱食终日，整日干的都是剥削人民的勾当，这群人严重阻碍了经济发展，更别提他们还引起了黑色星期一。他们将会成为这场经济改革中的第一个牺牲品。"
 IRE_national_dividend: "国家分红"
 IRE_national_dividend_desc: "向公民支付“社会信用”或“国家红利”对于纠正机器时代在的消费能力和工业的生产能力之间的长期滞后至关重要。假如不这么做的话，他们就会成为国家民粹主义分子的猎物。"
 IRE_finacial_freedom: "金融自由"
 IRE_finacial_freedom_desc: "长期以来爱尔兰的经济严重依赖德国，德国企业控制了爱尔兰的方方面面，黑色星期一时爱尔兰也因此受到了巨大的冲击。爱尔兰的经济命脉必须抓在爱尔兰自己的手中！"
 IRE_woman_Liberation: "妇女解放"
 IRE_woman_Liberation_desc: "作为一位女权主义者，莫德·贡娜一直积极支持爱尔兰妇女解放运动。女性作为忠诚公民和聪明的人类灵魂，有必要与男性享有相同权利。"
 IRE_crush_party_system: "终结政党政治"
 IRE_crush_party_system_desc: "政党政治带来了低效与争吵，完全是正常政府不应该有的。所有其他政党都将会被取缔，这样他们就不能继续用混乱离间人民。"
 IRE_economic_democracy: "经济民主"
 IRE_economic_democracy_desc: "丹尼斯·爱尔兰认为，在一个人为稀缺的世界中，现代世界最强大的力量——民族主义的理念，最终必须转向经济民主主义。否则，国家民粹主义者就会趁虚而入。"
 IRE_end_anglo_reactionism_remains: "摧毁盎格鲁反动影响"
 IRE_end_anglo_reactionism_remains_desc: "逃亡加拿大的饥荒女王的后继者仍然贼心不死，试图通过煽动阿尔斯特新教徒来破坏爱尔兰的稳定。迟早有一天，我们会让他们付出代价。"
 IRE_equalty_and_humanity: "平等与人道"
 IRE_equalty_and_humanity_desc: "平等与人道是爱尔兰社会信用党的信条。正如道格拉斯所说：“社会信用属于全体人民，其使用应使所有人受益，而不仅仅是少数特权阶级。”"
 IRE_social_credit_to_justice: "通过社会信用实现社会正义"
 IRE_social_credit_to_justice_desc: "经过我们的努力，社会信用在爱尔兰得到了实现，一个真正为了人民的经济体制为所有人带来了繁荣。"
