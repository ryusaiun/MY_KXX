 newIreland.5.t: "反政变"
 newIreland.5.d: "就在旧国王被推翻之后不久，一群反对君主制的左翼分子对都柏林发动了突然袭击，许多军队已经被策反，托蒙德伯爵的统治摇摇欲坠。"
 newIreland.5.a: "叛军被赶走了！"
 newIreland.5.b: "都柏林沦陷了！"
 newIreland.6.t: "实现社会信用思想之团结"
 newIreland.6.d: "道格拉斯的思想如今已经在爱尔兰的土地上开花结果，然而，许多道格拉斯思想的信徒反对我们的社会主义性质的改革，反而鼓吹保守主义乃至独裁专制。有鉴于此，莫德·贡娜提出应当以武力征服所有有社会信用政党的国家，实现社会信用思想的统一。我们真的要这么做吗？"
 newIreland.6.a: "算了吧。"
 newIreland.6.b: "我们才是真正的社会信用思想继承人！"
 newIreland.6.c: "我感到无力，或许应该让我们的盟友来处理……"
 newIreland.7.t: "共和国的选举日"
 newIreland.7.d: "莫德·贡娜宣布退出政治，回到修道院后，新一轮的权力交接开始了，不知哪一派能够取得多数，实现自己的理想抱负，让爱尔兰永远自由？"
 newIreland.7.a: "社会信用党"
 newIreland.7.b: "革命工人党"
 newIreland.7.c: "工党"
 newIreland.7.e: "在大家伙撕的不可开交时，威廉·巴特勒·叶芝登上了舞台。"
 newIreland.8.t: "社会信用之花的枯萎"
 newIreland.8.d: "威廉·巴特勒·叶芝也已和莫德·贡娜一样垂垂老矣，他此刻登上舞台并非真正希望获得权力，而是他背后的精英主义团体试图反扑，削减红宝石之岛激进共和主义造成的影响。叛变的民兵们让大会变成了牢笼，而下一步会是如何……"
 newIreland.8.a: "叶芝选择了同保守主义者站在一起，发扬他的神秘学观念"
 newIreland.8.b: "叶芝选择了同国家主义的极权者站在一起，以神秘主义继续革命"
