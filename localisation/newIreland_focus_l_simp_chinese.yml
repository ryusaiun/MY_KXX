l_simp_chinese:
 IRE_de_Provoking_the_British_civil_war:0 "挑动英国内战"
 IRE_de_Provoking_the_British_civil_war_desc:0 "虽然我们自身的力量是薄弱的，但只要我们能够在英国制造一些混乱，那我们就有希望胜利"
 IRE_Support_the_socialists_to_make_another_revolution:0 "支援社会主义者再次革命"
 IRE_Induce_military_rebellion:0 "诱导军队叛乱"
 IRE_Support_Scottish_and_Welsh_forces:0 "支持苏格兰和威尔士地方势力"
 IRE_de_One_by_one:0 "逐个解决"
 IRE_de_One_by_one_desc:0 "英国陷入了一片混乱之中，各方势力都在互相角逐，是时候亲自出手了"
 IRE_Personally:0 "下场收网"
 IRE_Remove_impurities:0 "去除杂质"
 IRE_London_negotiations:0 "伦敦谈判（不列颠已在我们手中）"
 IRE_London_negotiations_desc:0 "我们清剿掉了所有的反动势力，是时候来决定英国的未来了"
 IRE_Incite_the_British_Navy_to_revolt:0 "鼓动英国海军起义"
 IRE_Dealing_with_the_problem_of_sailors:0 "解决英国水手问题"
 IRE_Dealing_with_the_problem_of_sailors_desc:0 "我们成功鼓动英国海军起义，但他们可不会心甘情愿地听我们的命令，如果不采取措施，他们将可能成为我们国家的不稳定因素"
 IRE_Officially_recruit_some_sailors:0 "正式招收部分水手"
 IRE_Negotiations_with_insurgent_naval_officers:0 "与起义海军军官谈判"
 IRE_Announce_the_official_merger_of_the_British_and_Irish_fleet:0 "宣布正式合并英爱舰队"
 IRE_Solve_the_problem_of_British_sailors:0 "解决英国水兵问题"
 IRE_de_Irish_America:0 "爱尔兰人的美国"
 IRE_de_Irish_America_desc:0 "在祖国身处低谷之时，大量的爱尔兰同胞选择前往遥远的另一个大陆以谋求生存，美利坚的发展离不开爱尔兰裔，是时候行动，让同胞们回归祖国的怀抱了，新英格兰将是我们的第一个跳板"
 IRE_Instigate_the_New_England_Socialist_Uprising:0 "策动新英格兰社会主义者起义"
 IRE_Declare_war_on_the_rulers_behind_New_England:0 "对新英格兰背后的统治者宣战"
 IRE_World_revolution:0 "世界革命"
 IRE_World_revolution_desc:0 "我们已经稳定了自身的局势，是时候把目光投向世界了,虽然我们仍然较为弱小，但我们仍然可以鼓动一些小国家的社会主义者起义，每一次起义都是对德帝国主义的重拳"
 IRE_Instigate_the_communist_uprising_in_lowland_countries:0 "策动低地国家共产主义者起义"
 IRE_Instigate_the_Danish_communist_uprising:0 "策动丹波共产主义者起义"
 IRE_Support_the_Third_Internationals_war_against_imperialism:0 "支援第三国际对帝国主义的战争"
 IRE_Support_the_Eastern_Revolution:0 "支援东方革命"
 IRE_de_ire_end:0 "第三国际爱尔兰部"
 IRE_de_ire_end_desc:0 "由于我们为世界革命做出的巨大贡献，法国公社的同志们邀请我们加入第三国际，但将会让我们成立一个新的分部，并由我们领导"
 IRE_Attract_New_England:0 "拉拢低地国家"
 IRE_Attract_Comrade_Dongfang:0 "拉拢东部革命政权"
 IRE_Attract_lowland_countries:0 "拉拢新英格兰"
 Third_International_Department_of_Ireland:0 "第三国际爱尔兰分部"
 IRE_kingdong:0"迁都伦敦"
 IRE_give_leaders:0 "接收旧政府军官"
 The_troubles_caused_by_the_uprising_sailors:0 "起义水兵带来的麻烦"
 The_troubles_caused_by_the_uprising_sailors_desc:0 "我们成功鼓动英国海军起义，但他们可不会心甘情愿地听我们的命令，如果不采取措施，他们将可能成为我们国家的不稳定因素"
 nsireland.1.t:0 "爱尔兰人控制了英伦三岛！"
 nsireland.1.desc:0 "英国在历经了革命和反革命政变后，又迎来了爱尔兰人，本周，赤爱共和军于伦敦进行了一次阅兵。但在盛大的宴会之后，是英国工团的惨淡下台，爱尔兰军队迅速控制了各地的政府，前英工团的工作人员被要求加入爱共政府，同时零散的反革命势力正在逃向加拿大"
 nsireland.1.a:0 "社会主义者的胜利！"
 nsireland.1.b:0 "英国的事怎么都那么糟糕"
 nsireland.2.t:0 "英国第二次革命胜利"
 nsireland.2.desc:0 "在爱尔兰同志的帮助下，英国工团主义者再一次打倒了反革命势力，这一次，工团反动了更彻底的清洗运动，大量的军队与政府人员被驱逐出境，但取而代之的是爱尔兰的特派人员，英国工团政府实质上已经被控制伦敦的爱尔兰政府掌握了"
 nsireland.2.a:0 "在我们的带领下，英国会有更好的未来"
 nsireland.2.b:0 "爱尔兰人的怀柔式侵略罢了"
 nsireland.3.t:0 "四分五裂式的胜利《爱丁堡协议》"
 nsireland.3.desc:0 "在爱尔兰的干涉下，根基不稳的英国反革命政府正式垮台了，但工团并没有迎来一个好的结局，在爱尔兰的施压下，英国革命政府签署了《爱丁堡协议》，苏格兰与威尔士被拆分开来"
 nsireland.3.a:0 "这对各个地区的均衡发展有好处"
 nsireland.3.b:0 "爱尔兰独立式的胜利"
 nsireland.4.t:0 "英国水兵起义！"
 nsireland.4.desc:0 "由于反革命政府对海军基层士兵的剥削，以及第一次社会主义革命带来的巨大影响，海军中的绝大多数水兵在本周挣脱了将军们的统治，大量舰船被起义士兵掌控，极少数顽固不化的小型舰船也随即被起义船只击沉，起义的海军摧毁了附近的军用港口，随后驶向了爱尔兰的方向，爱尔兰为此似乎早有准备，在短暂的谈判后全屏接收了起义海军，爱尔兰对外宣传只是为英国海军提供庇护港，但起义船只上同时挂起了爱尔兰旗证明爱共另有所谋"
 nsireland.4.a:0 "全面的胜利！"
 nsireland.4.b:0 "英国水兵全跑辣？"
 nsireland.4.c:0 "离谱！给我清洗全国的工团分子！"
 nsireland.5.t:0 "英国水兵起义！"
 nsireland.5.desc:0 "由于反革命政府对海军基层士兵的剥削，以及第一次社会主义革命带来的巨大影响，海军中的绝大多数水兵在本周挣脱了束缚，但仍有部分船只选择站在起义的对立面，双方在港口爆发混战，战事一直发展到海上，最终起义部队成功击垮了敌人，带着剩余的船只奔向了爱尔兰，拉金主席宣布向起义部队打开国门，并将其安置在都柏林的港口。"
 nsireland.5.b:0 "传奇的英国海军永别辣"
 nsireland.5.a:0 "全面的胜利！"
 nsireland.5.c:0 "离谱！给我清洗全国的工团分子！"
 nsireland.6.t:0 "第三国际的扩张"
 nsireland.6.desc:0 "近日，在法国公社的邀请下，爱尔兰人参加了第三国际的会议，会议上法国人表述了要让爱尔兰自己组建一个新的第三国际分部，并继续积极扩张社会主义势力，会后不久，拉金主席在都柏林宣告了第三国际——爱尔兰分部的成立，他们将主要负责对美洲的革命"
 nsireland.6.a:0 "我们的新未来"
 nsireland.6.b:0 "好吧" 
 IRE_Failure_of_the_British_Revolution:0 "英国革命的失败"
 IRE_Failure_of_the_British_Revolution_desc:0 "英国的社会主义革命失败了，英国的将军控制了大不列颠岛的政府，而我们却成为了他们的红色邻居，我们必须做出决策"
 IRE_Liberate_the_British_people_who_have_been_oppressed_again:0 "解放再次受到压迫的英国人民"
 IRE_Liberate_the_British_people_who_have_been_oppressed_again_desc:0 "我们坚决不会让英国的无产阶级再次被压迫，英国本土上的反动派必须被打倒！"
 IRE_wait_and_see_its_change:0 "静观其变"
 IRE_wait_and_see_its_change_desc:0 "我们的力量太过薄弱了，现在对英国宣战就是自取灭亡"
 IRE_Prepare_for_war_immediately:0 "立刻备武"
 IRE_Prepare_for_war_immediately_desc:0 "爱尔兰打响了对英国反革命的战争，但我们缺少武器装备，必须立刻动员起全国，进行总体战"
 IRE_Call_for_action:0 "征召行动"
 IRE_Call_for_action_desc:0 "爱尔兰打响了对英国反革命的战争，但我们缺少人力，必须立刻动员起全国，进行总体战"
 IRE_Britain_is_in_our_hands:0 "不列颠已在我们手中"
 IRE_Britain_is_in_our_hands_desc:0 "不列颠岛彻底解放了！曾经压迫我们的英国反革命政府已经彻底灭亡，我们将为英国人民带来新的未来"
 IRE_Provoking_the_British_civil_war:0 "挑动英国内战"
 IRE_Provoking_the_British_civil_war_desc:0 "爱尔兰自己的力量很弱，但如果我们能团结英国的地下抵抗力量，我们将会有实力打倒敌人"
 IRE_One_by_one:0 "逐个击破"
 IRE_One_by_one_desc:0 "英国内战炸出了各种各样的派系，他们不是我们的团结对象，向他们开火！"
 IRE_Overseas_plans:0 "对海外的计划"
 IRE_Overseas_plans_desc:0 "我们成功解决了英伦三岛的事物，是时候向世界前进了"
 IRE_Ireland_America:0 "爱尔兰人的美国"
 IRE_Ireland_America_desc:0 "自爱尔兰大饥荒以来，无数的爱尔兰人向海外流去，尤其以美国为主，如今美国陷入了内战的深渊，让全美国的爱尔兰人团结起来！美国是爱尔兰人民的另一个家！"
 IRE_Support_the_Europa_Revolution:0 "支援欧罗巴革命"
 IRE_Support_the_Europa_Revolution_desc:0 "欧洲的人民正处于水深火热之中，我们必须支持全欧罗巴的社会主义人士"
 IRE_Support_the_Eastern_Revolution:0 "支援东方革命"
 IRE_Support_the_Eastern_Revolution_desc:0 "亚洲的人民正处于水深火热之中，我们必须支持全东方的社会主义人士"
 IRE_The_Communist_International_under_the_leadership_of_Ruby_Island:0 "红宝石岛领导下的共产国际"
 IRE_The_Communist_International_under_the_leadership_of_Ruby_Island_desc:0 "世界的革命势力正在向我们靠拢，我们将会建立起自己的社会主义国际，并与第三国际携手共进"
 IRE_Attack_the_revolutionary_allies:0 "对革命的盟友下手"
 IRE_Attack_the_revolutionary_allies_desc:0 "为了我们自己的生存，即便英国已经经过了社会主义的洗礼，但我们也不得不下手了"
 IRE_English_sailors:0 "英国水手"
 IRE_English_sailors_desc:0 "大部分英国水兵仍然忠诚于革命政府，如果我们愿意派遣人员潜入其中，就等鼓动水兵们起义，到时英国将会失去他们引以为傲的舰队"
 IRE_irish_sphere: "爱尔兰之雄心"
 IRE_irish_sphere_desc: "我们是凯尔特人——一个古老的民族的后裔，其后代分布于世界各地。是时候开始将所有的凯尔特人及其后裔联合起来了。英国人可以建立遍布全球的巨大关系网，凭什么我们不行？爱尔兰将会成为世界强权！"
 IRE_fuck_carles: "拯救阿根廷爱尔兰人"
 IRE_fuck_carles_desc: "上世纪30年代至90年代，为了躲避饥荒，有大概3万爱尔兰人移居阿根廷，并在当地建立了爱尔兰人社区。如今，信奉极端民族主义的阿根廷爱国联盟在阿根廷上台，他们的反对少数民族政策对我们的同胞造成了巨大威胁。我们将会前去推翻这一暴君。"
 IRE_overthrow_canada: "新仇旧恨"
 IRE_overthrow_canada_desc: "曾经压迫我们的英国主子逃到了加拿大依旧贼心不改，在不停打压当地人的同时谋划着反攻本土，这样他们就能像过去一样压迫我们。这决不能发生！我们将会向渥太华进军，不仅是为了当地的凯尔特同胞，更是为了在无数场反英起义中倒下的先辈们！"
 IRE_attack_ast: "夺取澳大利亚"
 IRE_attack_ast_desc: "澳大利亚当地的爱尔兰人不算多，但比例很高。是时候将被困在英国流放地的游子们接回家了。"
 IRE_attack_iceland: "重返冰岛"
 IRE_attack_iceland_desc: "爱尔兰人第一个发现了冰岛。而且冰岛人的血统毫无疑问属于凯尔特人。我们将会夺取冰岛。"
 IRE_ibearian_ancestors: "伊比利亚祖先"
 IRE_ibearian_ancestors_desc: "爱尔兰的第一批定居者就包括来自巴斯克与加利西亚等地的原住民。而如今伊比利亚已经陷入一片混乱，是时候回归我们祖先之地了。"
 IRE_attack_norway: "维京起源"
 IRE_attack_norway_desc: "维京人对不列颠群岛的入侵极大的影响了爱尔兰人的文化。有证据证实，爱尔兰人有一定的维京人血统。登船吧，伙计们！我们要去挪威了！"
 IRE_liberate_brittany: "解放布列塔尼"
 IRE_liberate_brittany_desc: "布列塔尼人毫无疑问是凯尔特人，但他们的文化如今已经濒临灭绝。我们将会解放他们，并实现法国的再凯尔特化。"
 IRE_celtic_internationale: "泛凯尔特国际"
 IRE_celtic_internationale_desc: "我们将会走自己的路，追求凯尔特人的统一。"
 IRE_pro_internationale: "倒向国际"
 IRE_pro_internationale_desc: "我们将会与第三国际建立更加紧密的联系。"
 IRE_irish_volunteers: "雁阵的遗产"
 IRE_irish_volunteers_desc: "曾有人如此评价爱尔兰人：“爱尔兰人在国外比国内更能当好士兵。”，南北战争中的爱尔兰旅更是勇猛无比。我们将会发扬这一遗产：哪里有受压迫者的反抗，哪里就有爱尔兰志愿军的身影。"
 IRE_negotiate_with_fop: "与巴塔哥尼亚联合"
 IRE_core_france: "高卢再凯尔特化"
 IRE_volunteers: "新雁阵"
 IRE_irish_hegemony: "迈向凯尔特圈"
 newIreland.3.t: "社会主义民主？"
 newIreland.3.d: "既然我们当初是民主选举上台的，不少人已经开始呼吁新的社会主义政府在政权稳定后开展选举——当然，只有社会主义政党可以参与选举。这当然是对那些认为社会主义就代表着独裁专制的反动派一记痛击，但如此同时，也可能意味着我们将会失去自己的权力。我们应该如何抉择？是让人民自由选择他们的保护者，还是维持一党专政？"
 newIreland.3.a: "保持一党专政。"
 newIreland.3.b: "开始筹备下一届选举。"
 newIreland.4.t: "新大选"
 newIreland.4.d: "选举日已经到来，全体爱尔兰人民将投下宝贵的一票，决定未来4年的执政党。结果已经出来了，胜利的政党是……"
 newIreland.4.a: "革命工人党。"
 newIreland.4.b: "工团联盟。"
 newIreland.4.c: "自由爱尔兰。"
 newIreland.4.e: "工党。"
 IRE_attack_greenland_faroes:0 "偷袭丹麦海外领地"
 IRE_attack_greenland_faroes_desc:0 "丹麦的格陵兰岛和法罗群岛也是冰岛海域权益的一部分，现在我们已经统治了半个北大西洋，有足够的实力来进行一场特别军事行动，即使是丹麦不愿意的情况下。"
 celtic_internationale_subject:0 "§G将解锁建立一系列凯尔特国家的决议§!"
 celtic_internationale_subject2:0 "§G战后使用决议可以让这些国家凯尔特化！§!"
 celts_great_revive:0 "§G法国、西班牙、挪威和澳大利亚已经凯尔特化§!"
 IRE_English_sailors_decision:0 "解锁§G解决英国水手问题§!的决议"
 IRE_Overseas_plans_decision:0 "解锁§R世界革命§!的相关决议。"
