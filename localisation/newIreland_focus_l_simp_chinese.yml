 IRE_Red_Avalonia:0 "阿瓦隆尼亚共和国"
 IRE_Red_Avalonia_ADJ:0 "阿瓦隆尼亚"
 IRE_Red_Avalonia_DEF:0 "阿瓦隆尼亚"
 IRE_celtiberia_subject:0 "在伊比利亚恢复凯尔特文化"
 IRE_gallia_subject:0 "在法兰西恢复高卢文化"
 IRE_hordaland_subject:0 "霍达维京部落的记忆"
 IRE_australia_subject:0 "远洋流浪的同胞们"
 IRE_argentina_subject:0 "不为人知的威尔士殖民地"
